<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b66">
<meta name="color-scheme" content="dark">
<title>Bruchwerkstatt – Erweitern und Kürzen</title>
<style>
/* =====================================================================
   Bruchwerkstatt – Design „Blaupause“
   Aufbau: 1 Token · 2 Grund · 3 Bruchdarstellung · 4 Kopf/Navigation ·
           5 Bausteine · 6 Hilfen (Pauspapier) · 7 Bruchbilder · 8 Aufgabentypen ·
           9 Menüs · 10 Spiele · 11 Anpassungen · 12 Bewegung
   Farbe = Bedeutung: Amber Hauptaktion/Hinweis · Orange Erweitern (×) ·
   Petrol Kürzen (÷) · Grün richtig · Rot falsch · helles Pauspapier = Hilfe
   ===================================================================== */

/* ---------- 1 Token ---------- */
:root{
  --bp:#0d3b66;--bp-2:#0a2f52;--bp-3:#14507f;
  --chalk:#f2f8ff;--chalk-dim:#b8d4ee;
  --grid:rgba(173,216,255,.13);--grid-2:rgba(173,216,255,.28);
  --amber:#ffc53d;--on-amber:#0b2a4a;
  --erw:#ff9248;--kue:#45e0d4;
  --ok:#8be3a9;--bad:#ff8c8c;
  --paper:#eef5fb;--ink:#0b2a4a;--ink-dim:#3d5a78;--mark:#ffe58a;
  --acc:var(--amber);
  --cell-stroke:var(--chalk);--cell-on:url(#hatch-amber);
  --fs:clamp(15px,calc(13.6px + .55vw),22px); /* Grundschrift wächst mit dem Display */
  --ui-scale:1;                                /* Textgröße aus den Optionen */
  --tap:max(44px,2.75rem);                     /* Mindestgröße für Tippflächen */
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

/* ---------- 2 Grund ---------- */
html[data-size="s"]{--ui-scale:.9}
html[data-size="l"]{--ui-scale:1.15}
html[data-size="xl"]{--ui-scale:1.3}
@media (orientation:landscape) and (max-height:520px){:root{--fs:14px}}
@media (max-height:380px){:root{--fs:13px}}
*{box-sizing:border-box}
html{
  font-size:min(calc(var(--fs) * var(--ui-scale)),5.8vw);
  -webkit-text-size-adjust:100%;min-height:100%;background-color:var(--bp);
  background-image:
    linear-gradient(var(--grid-2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:7.5rem 7.5rem,7.5rem 7.5rem,1.5rem 1.5rem,1.5rem 1.5rem;
}
body{margin:0;min-height:100dvh;color:var(--chalk);font:1.0625rem/1.5 var(--font-body);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
p{margin:.4em 0 .7em}
.hidden{display:none!important}
.lblm{font:600 .7rem/1.2 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--chalk-dim)}

/* Linien-Symbole (Sprite) */
.ic{width:1.3em;height:1.3em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.3em;overflow:visible}
.ic.fill{fill:currentColor}
.ic.big{width:2.4rem;height:2.4rem}

/* ---------- 3 Bruchdarstellung ---------- */
.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;line-height:1.15;margin:0 .12em;font-weight:700;font-variant-numeric:tabular-nums}
.frac>.num{border-bottom:.11em solid currentColor;padding:0 .3em .06em}
.frac>.den{padding:.06em .3em 0}
.mixed{display:inline-flex;align-items:center;gap:.1em;vertical-align:middle}
.mixed .whole{font-size:1.25em;font-weight:700;margin-right:.1em}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:.4em .3em;font-size:1.55rem;margin:.4em 0}
.eq.small{font-size:1.2rem}
.op{padding:0 .2em;font-weight:700;color:var(--amber)}
.frac.inp>.num{padding-bottom:0.375rem}
.frac.inp>.den{padding-top:0.375rem}
.frac.inp input,input.intin,input.decin{
  width:5em;height:max(48px,3rem);text-align:center;font:700 1.15rem var(--font-mono);
  color:var(--chalk);background:var(--bp-2);border:2px solid var(--chalk);border-radius:2px;padding:0 0.375rem;caret-color:var(--amber);
}
input.intin{width:5.5em}
input.decin{width:8em}
input:focus{outline:none;border-color:var(--amber)!important;box-shadow:0 0 0 3px rgba(255,197,61,.35)}
input.bad{border-color:var(--bad);outline:2px dotted var(--bad);outline-offset:3px}
input.good{border-color:var(--ok)}
input:disabled{opacity:.8}
.q{font-size:1.2rem;margin:.2em 0 .6em}
.q .frac{font-size:1.35em}
.q small{font-size:.85em;color:var(--chalk-dim)}

/* ---------- 4 Kopf und Navigation ---------- */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:0.625rem;min-height:max(56px,3.5rem);
  padding:0.375rem max(0.75rem,calc((100% - 45rem)/2));padding-top:max(0.375rem,env(safe-area-inset-top));
  background:var(--bp-2);border-bottom:2px solid var(--chalk);box-shadow:0 4px 0 var(--bp),0 5px 0 var(--grid-2);
}
.brand{display:flex;align-items:center;gap:0.5rem;font:700 .9rem var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--chalk)}
.brand{min-width:0}
.brand .bt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .ic{color:var(--amber);flex:none}
.gchip{flex:none}
.topbar .title{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar{container-type:inline-size}
@container (max-width:22.5rem){.topbar .title{display:none}}
.backbtn{min-height:max(44px,2.75rem)}

/* Messanzeige (Rang + XP) */
.gchip{display:flex;align-items:center;gap:0.5rem;margin-left:auto;padding:0.1875rem 0.5625rem;background:var(--bp);border:2px solid var(--chalk);white-space:nowrap;font:inherit;color:var(--chalk);text-align:left;cursor:pointer;min-height:max(44px,2.75rem);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.gchip:active{transform:translateY(2px);box-shadow:none}
.gchev .ic{width:.95rem;height:.95rem;color:var(--chalk-dim)}
.gicon .ic{width:1.625rem;height:1.625rem;color:var(--amber)}
.gtext{display:flex;flex-direction:column;gap:0.1875rem;min-width:5.25rem}
.gname{font:700 .64rem/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase}
.gseg{display:flex;gap:0.125rem}
.gseg i{width:0.4375rem;height:0.5625rem;background:rgba(184,212,238,.22)}
.gseg i.on{background:var(--amber)}
.gxp{font:700 .9rem var(--font-mono);color:var(--amber)}
.gstreak{font:700 .78rem var(--font-mono);color:var(--erw);letter-spacing:.05em}
.gbar{display:block;height:0.625rem;background:rgba(184,212,238,.22)}
.gbar i{display:block;height:100%;background:var(--amber)}

/* Werkzeugleiste unten */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;padding-left:max(0rem,calc((100% - 45rem)/2));padding-right:max(0rem,calc((100% - 45rem)/2));background:var(--bp-2);border-top:2px solid var(--chalk);padding-bottom:env(safe-area-inset-bottom)}
.navb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.125rem;min-height:max(62px,3.875rem);border:0;border-top:4px solid transparent;background:none;color:var(--chalk-dim);cursor:pointer;font:700 .7rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase}
.navb .ic{width:1.625rem;height:1.625rem}
.navb[aria-current="true"]{color:var(--amber);border-top-color:var(--amber);background:rgba(255,197,61,.07)}

/* ---------- 5 Bausteine ---------- */
.shell{max-width:45rem;margin:0 auto;padding:0.75rem 0.875rem 0}
.page{min-height:100dvh;display:flex;flex-direction:column}
.page>.shell{flex:1 1 auto;display:flex;flex-direction:column;width:100%}
.work{display:flex;flex-direction:column;flex:1 1 auto}
.work[data-acc="erw"]{--acc:var(--erw)}
.work[data-acc="kue"]{--acc:var(--kue)}
.work[data-acc="mix"]{--acc:linear-gradient(90deg,var(--erw) 50%,var(--kue) 50%)}
.work[data-acc="ok"]{--acc:var(--ok)}

/* Zeichenblatt mit Schnittmarken und Schriftfeld */
.card{position:relative;background:var(--bp-2);border:2px solid var(--chalk);padding:1rem 1rem 0}
.card::before{content:"";position:absolute;inset:0.25rem;border:1px solid var(--grid-2);pointer-events:none}
.card::after{
  content:"";position:absolute;inset:-0.375rem;pointer-events:none;background-repeat:no-repeat;
  background-image:
    linear-gradient(var(--chalk-dim),var(--chalk-dim)),linear-gradient(var(--chalk-dim),var(--chalk-dim)),
    linear-gradient(var(--chalk-dim),var(--chalk-dim)),linear-gradient(var(--chalk-dim),var(--chalk-dim)),
    linear-gradient(var(--chalk-dim),var(--chalk-dim)),linear-gradient(var(--chalk-dim),var(--chalk-dim)),
    linear-gradient(var(--chalk-dim),var(--chalk-dim)),linear-gradient(var(--chalk-dim),var(--chalk-dim));
  background-size:12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px;
  background-position:left top,left top,right top,right top,left bottom,left bottom,right bottom,right bottom;
}
.card>:last-child:not(.titleblock){margin-bottom:1rem}
.titleblock{display:flex;margin:0.875rem -1rem 0;border-top:2px solid var(--chalk);font:600 .68rem/1.2 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;position:relative;z-index:1}
.titleblock>*{padding:0.4375rem 0.625rem}
.titleblock .tb-id{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:0.375rem;color:var(--on-amber);background:var(--acc);font-weight:700}
.titleblock .tb-id .ic{flex:none}
.titleblock .tb-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titleblock .tb-c{border-left:2px solid var(--chalk);white-space:nowrap}

/* Lineal-Fortschritt */
.ruler{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0.25rem;align-items:end;margin:0 0 0.75rem}
.ruler .tk{height:1.375rem;border:2px solid var(--chalk-dim);background:linear-gradient(90deg,transparent 0 4px,rgba(184,212,238,.35) 4px 5px) left bottom/6px 7px repeat-x}
.ruler .tk.f{background:var(--ok);border-color:var(--ok)}
.ruler .tk.l{background:repeating-linear-gradient(45deg,var(--ok) 0 3px,transparent 3px 7px);border-color:var(--ok)}
.ruler .tk.x{background:repeating-linear-gradient(-45deg,var(--bad) 0 1px,transparent 1px 6px);border-color:var(--bad)}
.ruler .tk.cur{border-color:var(--amber);background:rgba(255,197,61,.18);animation:blink 1.2s steps(2,jump-none) infinite}

/* Knöpfe */
.btn{min-height:max(48px,3rem);padding:0 1rem;border:2px solid var(--chalk);background:var(--bp-2);color:var(--chalk);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;text-align:center;border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:hover:not(:disabled){background:var(--bp-3)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.btn:disabled{border-style:dashed;opacity:.5;cursor:default;box-shadow:none}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn.primary:hover:not(:disabled){background:#ffd166}
.btn.small{min-height:max(44px,2.75rem);padding:0 0.75rem;font-size:.95rem}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.go{background:var(--ok);border-color:var(--ok);color:var(--on-amber)}
.linkbtn{min-height:max(48px,3rem);padding:0 0.5rem;background:none;border:0;border-bottom:2px dashed var(--chalk-dim);color:var(--chalk);cursor:pointer;display:inline-flex;align-items:center;gap:0.375rem;font-weight:600}
.linkrow{display:flex;gap:1.125rem;justify-content:center;flex-wrap:wrap;margin:0.625rem 0 0.25rem}
.rowbtns{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.5rem}

/* Umschalter Leicht / Knifflig */
.seg{display:inline-flex;border:2px solid var(--chalk)}
.seg button{border:0;background:var(--bp-2);color:var(--chalk);min-height:max(48px,3rem);padding:0 0.875rem;cursor:pointer;font:700 .8rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;display:inline-flex;align-items:center;gap:0.375rem}
.seg button+button{border-left:2px solid var(--chalk)}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--on-amber)}
.levelrow{display:flex;gap:0.625rem;align-items:center;justify-content:flex-start;margin:0.375rem 0 0.875rem}

/* Stepper */
.stepper{display:inline-flex;align-items:center;gap:0.375rem;margin:0.25rem 0.75rem 0.25rem 0}
.stepper .lab{min-width:4.5em;font:600 .72rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-dim)}
.stepper button{width:max(48px,3rem);height:max(48px,3rem);border:2px solid var(--chalk);background:var(--bp-2);color:var(--chalk);font:700 1.4rem var(--font-mono);cursor:pointer;border-radius:2px}
.stepper button:active:not(:disabled){background:var(--bp-3)}
.stepper button:disabled{border-style:dashed;opacity:.4;cursor:default}
.stepper output{min-width:2.2em;text-align:center;font:700 1.2rem var(--font-mono);color:var(--amber)}
.controls{display:flex;flex-wrap:wrap;gap:0.375rem 0.25rem;margin:0.625rem 0}

/* Aufgabe */
.prompt{margin-bottom:0.375rem}
.prompt::before{content:"Aufgabe";display:block;font:600 .68rem/1 var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--chalk-dim);margin-bottom:0.375rem}
.split{display:grid;gap:1.125rem;align-items:start}
.stage{margin:0.5rem 0 0.25rem}
.feedback{min-height:0.0625rem}
.hints{margin:0}

/* Rückmeldung: Prüfstempel */
.msg{position:relative;margin:0 0 0.375rem;padding:0.625rem 0.75rem 0.625rem 6rem;border:2px solid var(--chalk-dim);background:var(--bp-2);min-height:max(48px,3rem);display:flex;align-items:center}
.msg::before{position:absolute;left:0.625rem;top:50%;transform:translateY(-50%) rotate(-7deg);padding:0.0625rem 0.375rem;border:2px solid currentColor;font:700 .72rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.msg.ok{border-color:var(--ok);padding-left:4.375rem}
.msg.ok::before{content:"OK";color:var(--ok);animation:stamp .35s ease-out}
.msg.bad{border-color:var(--bad)}
.msg.bad::before{content:"Prüfen";color:var(--bad);animation:stamp .35s ease-out}
.msg.info{border-style:dashed}
.msg.info::before{content:"Info";color:var(--amber)}
.msg.warn{border-color:var(--amber)}
.msg.warn::before{content:"Fast";color:var(--amber);animation:stamp .35s ease-out}

/* Hinweis (Pauspapier-Zettel im Bedienpult) */
.hint{position:relative;margin:0 0 0.375rem;padding:0.5rem 0.75rem 0.5rem 0.875rem;background:var(--paper);color:var(--ink);border:2px solid var(--amber);border-left-width:10px}
.hint b.lab{display:flex;align-items:center;gap:0.375rem;font:700 .68rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.hint p{margin:.25em 0}
.hint-head{display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.hint-toggle{display:inline-flex;align-items:center;gap:0.25rem;min-height:max(44px,2.75rem);padding:0 0.375rem;border:0;background:none;color:var(--ink);cursor:pointer;font:700 .68rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.hint-toggle .ic{width:1.1rem;height:1.1rem}
.hint-closed{display:flex;align-items:center;gap:0.5rem;width:100%;min-height:max(44px,2.75rem);text-align:left;cursor:pointer;font:700 .72rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.hint-closed .ht{flex:1}
.hint-closed .hs{color:var(--ink-dim)}
.hint-closed .ic{width:1.1rem;height:1.1rem}

/* Musterlösung */
.solution{margin-top:0.75rem}
.solbox{background:var(--paper);color:var(--ink);border:2px dashed var(--ink);padding:0.75rem 0.875rem}
.solbox h4{display:flex;align-items:center;gap:0.5rem;margin:0 0 0.375rem;font:700 .72rem var(--font-mono);letter-spacing:.14em;text-transform:uppercase}
.sol-line{margin:0.375rem 0}
.solbox .frac,.solbox .eq{color:var(--ink)}
.solbox .op{color:var(--ink-dim)}

/* Bedienpult */
.actionbar{
  position:sticky;bottom:0;margin:0.75rem -0.875rem 0;margin-top:auto;padding:0.75rem 0.875rem calc(0.625rem + env(safe-area-inset-bottom));z-index:20;
  background:var(--bp-2);border-top:2px solid var(--chalk);
  background-image:radial-gradient(circle at 10px 10px,var(--chalk-dim) 0 2px,transparent 2.5px),radial-gradient(circle at calc(100% - 10px) 10px,var(--chalk-dim) 0 2px,transparent 2.5px);
  background-repeat:no-repeat;
}
.actionbar::before{content:"";position:absolute;left:0;right:0;top:0.1875rem;border-top:1px solid var(--grid-2)}
.dockmsg{max-height:26vh;overflow:auto;margin-bottom:0.375rem}
.dockmsg:empty{display:none}
.primaryrow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0.5rem}
.primaryrow .btn{padding:0.125rem 0.375rem;font-size:.95rem;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;overflow-wrap:anywhere}
/* Das Bedienpult passt sich seiner Breite an (gemessen in rem, also inklusive Textgröße):
   erst kleinere Schrift, dann zwei Reihen – so wird nie ein Knopftext abgeschnitten. */
.actionbar{container-type:inline-size}
@container (max-width:21.5rem){
  .primaryrow .btn{font-size:.85rem;padding:0.125rem 0.25rem}
}
@container (max-width:18rem){
  .primaryrow{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:1fr 1fr}
  .primaryrow>.btn:last-child:nth-child(odd){grid-column:1/-1}
  .primaryrow .btn{font-size:.95rem;padding:0.125rem 0.375rem}
}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:0.375rem;max-width:32.5rem;margin:0 auto 0.5rem}
.key{min-height:max(46px,2.875rem);border:2px solid var(--chalk);background:var(--bp);color:var(--chalk);font:700 1.3rem var(--font-mono);cursor:pointer;padding:0;border-radius:2px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.key:active{transform:translateY(2px);box-shadow:none;background:var(--bp-3)}
.key.fn{background:var(--bp-2);color:var(--amber);font-size:1.05rem}

/* LCD-Einblendung */
.toast{position:fixed;left:50%;transform:translateX(-50%) scale(.85);opacity:0;pointer-events:none;z-index:200;white-space:nowrap;padding:0.375rem 0.875rem;background:#06223d;color:var(--amber);border:2px solid var(--amber);font:700 1.05rem var(--font-mono);letter-spacing:.06em;transition:opacity .15s,transform .15s}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}

/* Urkunde / Dialog */
.modal{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:1.25rem;background:rgba(5,25,45,.8)}
.modalcard{position:relative;max-width:22.5rem;width:100%;padding:1.375rem;text-align:center;background:var(--paper);color:var(--ink);border:3px double var(--ink)}
.modalcard .ic.big{color:var(--ink)}
.modalcard h2{font:700 .8rem var(--font-mono);letter-spacing:.2em;text-transform:uppercase;margin:0.375rem 0}
.rankname{font:700 1.7rem var(--font-body);margin:.1em 0 .5em}
.modalcard .btn{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.summary .stampbox{color:var(--ok)}
.stampbox{display:inline-block;transform:rotate(-6deg);padding:0.125rem 0.625rem;border:3px solid var(--ok);color:#1f7a45;font:700 1rem var(--font-mono);letter-spacing:.14em;text-transform:uppercase;animation:stampin .4s ease-out}

.note-storage{font-size:.85rem;color:var(--chalk-dim);text-align:center;padding:0.375rem 0.375rem 5rem}

/* ---------- 6 Hilfen = Pauspapier ---------- */
.help{position:fixed;z-index:60;top:0;right:0;bottom:0;width:min(27.5rem,92vw);padding:1rem 1.125rem;overflow:auto;transform:translateX(105%);visibility:hidden;transition:transform .2s,visibility .2s;background:var(--paper);color:var(--ink);border-left:3px double var(--ink);--cell-stroke:var(--ink);--cell-on:url(#hatch-ink)}
.help.open{transform:none;visibility:visible}
.helphead{display:flex;align-items:center;justify-content:space-between;gap:0.625rem;margin-bottom:0.5rem}
.helphead h2{margin:0;font:700 .8rem var(--font-mono);letter-spacing:.16em;text-transform:uppercase}
.help .btn{background:var(--paper);color:var(--ink);border-color:var(--ink)}
.scrim{display:none}
.scrim.show{display:block;position:fixed;inset:0;z-index:50;background:rgba(5,25,45,.7)}
.note{position:relative;margin:0.75rem 0;padding:0.75rem 0.875rem;background:#fff;border:2px solid var(--ink)}
.note h3{margin:0 0 0.375rem;font:700 .72rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.note strong{background:linear-gradient(transparent 55%,var(--mark) 55%)}
.note .ex{margin:0.5rem 0}
.note .figrow{display:flex;flex-direction:column;gap:0.375rem;margin-top:0.5rem}
.note .fig{display:grid;grid-template-columns:3.5rem minmax(0,1fr);column-gap:0.625rem;align-items:center} /* feste Beschriftungsspalte: alle Streifen beginnen und enden bündig */
.note .fig>.frac{justify-self:center}
.note .fig svg{min-width:0}
.note table{border-collapse:collapse;width:100%;font-size:.95rem;margin:0.375rem 0}
.note th,.note td{border:1.5px solid var(--ink);padding:0.25rem 0.5rem;text-align:center}
.note .eq,.note .frac{color:var(--ink)}
.note .op{color:var(--ink-dim)}
.rule{margin:0.625rem 0;padding:0.5rem 0.75rem;background:var(--mark);color:var(--ink);border-left:6px solid var(--ink);font-size:.97rem}
.stats{font-size:.95rem}
.stats td{padding:0.125rem 0.75rem 0.125rem 0}
.statsbox summary,.settings summary{cursor:pointer;padding:0.625rem 0;font:700 .72rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase}

/* ---------- 7 Bruchbilder ---------- */
svg.fracsvg{display:block;width:100%;height:auto;overflow:visible}
.cell>*{fill:transparent;stroke:var(--cell-stroke);stroke-width:1.6;transition:fill .12s}
.cell.on>*{fill:var(--cell-on)}
svg.sm .cell>*{stroke-width:1.5;vector-effect:non-scaling-stroke}
g.cell[role="button"]{cursor:pointer}
@media (hover:hover){g.cell[role="button"]:hover>*{fill:rgba(255,197,61,.18)}g.cell.on[role="button"]:hover>*{fill:var(--cell-on);opacity:.85}}
g.cell{outline:none}
g.cell:focus-visible>*{stroke:var(--amber);stroke-width:4}
svg.interactive{touch-action:none}
.fig{margin:0}
.fig figcaption{margin-top:0.25rem;font:600 .8rem var(--font-mono);color:var(--chalk-dim)}
.fig.erw{--cell-on:url(#hatch-erw)}
.fig.kue{--cell-on:url(#hatch-kue)}
.figpair{display:flex;gap:0.75rem;align-items:center}
.figpair .orig{flex:0 0 7.5rem}
.figpair .edit{flex:1;min-width:0}
.cap{margin-top:0.25rem;font:600 .72rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-dim);text-align:center}
/* Maßlinie */
.dimcap{display:flex;align-items:center;gap:0.375rem;margin-top:0.25rem;color:var(--amber);font:700 .75rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.dimcap i{position:relative;flex:1;height:0;border-top:1.5px solid currentColor}
.dimcap i:first-child::before,.dimcap i:last-child::after{content:"";position:absolute;top:-0.3125rem;border:4.5px solid transparent}
.dimcap i:first-child::before{left:0;border-right:8px solid currentColor;border-left:0}
.dimcap i:last-child::after{right:0;border-left:8px solid currentColor;border-right:0}

/* ---------- 8 Aufgabentypen ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.125rem,1fr));gap:0.625rem;margin-top:0.5rem}
.pick{position:relative;min-height:5.625rem;padding:0.625rem;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.35);--cell-stroke:var(--ink);--cell-on:url(#hatch-ink)}
.pick[aria-pressed="true"]{background:var(--mark);box-shadow:inset 0 0 0 3px var(--ink)}
.pick:active{transform:translateY(2px)}
.pick svg{max-width:9.375rem}
.pick .frac{color:var(--ink)}
.opts{display:grid;gap:0.5rem;margin:0.5rem 0 0.875rem}
.opt{display:flex;gap:0.625rem;align-items:flex-start;padding:0.625rem 0.75rem;min-height:max(48px,3rem);cursor:pointer;background:var(--bp);border:2px solid var(--chalk-dim)}
.opt input{width:1.375rem;height:1.375rem;margin-top:0.125rem;flex:none;accent-color:var(--amber)}
.opt:has(input:checked){border-color:var(--amber);background:rgba(255,197,61,.12)}
.wrongclaim{display:inline-block;padding:0.5rem 0.875rem;border:2px solid var(--bad);outline:2px dotted var(--bad);outline-offset:3px}
.famrow{display:flex;align-items:center;gap:0.625rem;margin:0.5rem 0}
.famrow .tag{font:700 .8rem var(--font-mono)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.cond{margin:0.5rem 0;padding-left:1.2em}
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin:0.875rem 0}
.btn.yn{min-height:5.25rem;font:700 1.3rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;border-width:3px}
.btn.yn .ic{width:1.6em;height:1.6em}
.btn.yn[aria-pressed="true"],.btn.none[aria-pressed="true"]{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}

/* Schnellcheck: Normteil-Karten A–D und Auswertung */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:0.625rem;margin:0.75rem 0 0.375rem}
.tiles-3{grid-template-columns:1fr}
.tile{position:relative;min-height:4.75rem;padding:0.75rem 0.625rem 0.75rem 2.5rem;display:flex;align-items:center;justify-content:center;gap:0.625rem;cursor:pointer;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.35);font:700 1.7rem var(--font-mono)}
.tile .ltr{position:absolute;left:0;top:0;bottom:0;width:1.75rem;display:grid;place-items:center;background:var(--ink);color:var(--paper);font:700 .85rem var(--font-mono)}
.tile .ic{width:1.5rem;height:1.5rem}
.tile.tile-ic .tv{font:700 1.05rem var(--font-body)}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.tile[aria-pressed="true"]{background:var(--mark)}
.tiles-3 .tile{min-height:4rem}
.tile:disabled{cursor:default;box-shadow:none}
.tile:disabled:not(.is-right):not(.is-wrong){opacity:.45}
.btn.yn{position:relative}
.mk{position:absolute;right:0;top:0;height:1.375rem;padding:0 0.4375rem;display:flex;align-items:center;gap:0.25rem;background:var(--ink);color:var(--paper);font:700 .62rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.mk .ic,.btn.yn .mk .ic{width:0.8125rem;height:0.8125rem}
.tile.is-right,.btn.yn.is-right:disabled{opacity:1;border-style:solid;border-color:var(--ink);background:var(--ok);color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
.tile.is-wrong,.btn.yn.is-wrong:disabled{opacity:1;border-style:solid;border-color:var(--ink);background:var(--bad) repeating-linear-gradient(-45deg,rgba(11,42,74,.2) 0 2px,transparent 2px 9px);color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
.blank{display:inline-block;min-width:1.3em;padding:0 .2em;border:2px dashed var(--amber);color:var(--amber);text-align:center;line-height:1.15;animation:blink 1.2s steps(2,jump-none) infinite}
.qsum{border-collapse:collapse;margin:0.625rem 0}
.qsum td{padding:0.3125rem 0.75rem 0.3125rem 0;vertical-align:middle}
.qm{display:inline-flex;margin-right:0.25rem}
.qm .ic{width:1.35rem;height:1.35rem}
.qm.ok{color:var(--ok)}.qm.bad{color:var(--bad)}
.qsum .sits{color:var(--ok)}.qsum .ueben{color:var(--amber)}

/* Kürzen-Maschine */
.machine{text-align:center}
.machhead{font:700 .75rem var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--kue);margin-bottom:0.25rem}
.machfrac{justify-content:center;font-size:2.4rem}
.machhist{min-height:1.4em;margin:0.125rem 0 0.625rem;font:600 .85rem var(--font-mono);color:var(--chalk-dim)}
.chiprow{display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;margin:0.375rem 0}
.chip{min-width:max(58px,3.625rem);min-height:max(52px,3.25rem);border:2px solid var(--kue);background:var(--bp);color:var(--kue);font:700 1.15rem var(--font-mono);cursor:pointer;border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.chip.erw{border-color:var(--erw);color:var(--erw)}
.chip:active:not(:disabled){transform:translateY(3px);box-shadow:none;background:rgba(69,224,212,.15)}
.chip:disabled{border-style:dashed;opacity:.35;cursor:default;box-shadow:none}
.machsg{min-height:1.5em;margin:0.375rem 0;font-weight:600}
.machsg.bad{color:var(--bad)}.machsg.ok{color:var(--ok)}
.machdone{margin:0.25rem 0;color:var(--ok);font-weight:600;display:flex;align-items:center;justify-content:center;gap:0.375rem}

/* Bruchlabor */
.lab .prompt::before{display:none}
.lab .prompt .q{margin:.1em 0 .5em}
.labseg{display:flex;width:100%;margin:0 0 0.625rem}
.labseg button{flex:1;justify-content:center}
.labfig{position:relative;max-width:35rem;margin:0.375rem auto 0.25rem}
.labrow{display:grid;grid-template-columns:3.9rem 1fr;gap:0.5rem;align-items:center;margin:0 0 0.5rem}
.labside{display:flex;flex-direction:column;align-items:center;gap:0.1875rem}
.labside .frac{font-size:1.1rem}
.labcap{font:700 .58rem/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim)}
.labcol .dimcap{margin-top:0.1875rem}
.labcol .dimcap span{position:relative;z-index:1;padding:0 0.375rem;background:var(--bp-2)}
.labmid{position:absolute;top:0;bottom:0;left:calc(3.9rem + 0.5rem + (100% - 3.9rem - 0.5rem) * var(--pos));border-left:2.5px dashed var(--amber);pointer-events:none}
.labfig.circle{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.labcell{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"cap cap" "fr svg" "dim dim";gap:0.25rem 0.5rem;align-items:center}
.labcell .labcap{grid-area:cap}
.labcell .labfr{grid-area:fr}
.labcell svg{grid-area:svg;justify-self:center;width:100%}
.labcell .dimcap{grid-area:dim}
.labcut{stroke:var(--amber);stroke-width:3;stroke-dasharray:7 5;fill:none}
.labsay{min-height:3.1em;margin:0.25rem 0}
.labtext{padding:0.25rem 0 0.25rem 0.625rem;border-left:4px solid var(--amber);font-size:.95rem}
.labctl{margin-bottom:0.5rem}
.labchips{display:grid;grid-template-columns:5.6rem repeat(4,1fr);gap:0.375rem;align-items:center;margin:0 0 0.375rem}
.labchips .lbl{display:flex;align-items:center;gap:0.25rem;font:700 .6rem/1.1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--kue)}
.labchips[data-op="x"] .lbl{color:var(--erw)}
.labchips .chip{width:100%;min-width:0}
.chip.off{border-style:dashed;opacity:.4;box-shadow:none}
.chip.off:active{transform:none;background:var(--bp)}
.tile.tile-txt{min-height:3.75rem;font:700 .95rem/1.2 var(--font-body)}
.tile.tile-txt .tv{text-align:center}
.labquiz .tiles{margin:0.125rem 0}
.labquiz .linkbtn{display:flex;margin:0 auto}
.labnote{margin:0.75rem 0}
.bomrow .labstat{grid-column:3 / 5;display:inline-flex;align-items:center;gap:0.25rem;font:700 .72rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.bomrow .labstat.done{color:var(--ok)}
.bomrow .labstat .ic{width:1rem;height:1rem}

/* Lernpfad: Anlagenschema */
.pfadhead{display:grid;grid-template-columns:1fr auto;gap:0.875rem;align-items:center;margin:0.375rem 0 0.75rem;padding:0.75rem 0.875rem;background:var(--bp-2);border:3px double var(--chalk)}
.ph-prog{display:flex;flex-direction:column;gap:0.375rem;min-width:0}
.ph-prog b{font:700 1rem var(--font-mono);letter-spacing:.08em}
.segn{display:flex;gap:0.1875rem}
.segn i{flex:1;max-width:1.625rem;height:0.875rem;border:1.5px solid var(--chalk-dim)}
.segn i.on{background:var(--ok);border-color:var(--ok)}
.ph-day{display:flex;flex-direction:column;align-items:center;gap:0.1875rem;min-width:5.75rem;text-align:center}
.ph-day small{font:700 .72rem var(--font-mono);letter-spacing:.06em;color:var(--chalk-dim)}
.ph-day small.gstreak{color:var(--erw)}
.lamp{display:grid;place-items:center;width:1.625rem;height:1.625rem;border:3px solid var(--amber);border-radius:50%;color:var(--on-amber);background:var(--bp)}
.lamp.on{background:var(--ok);border-color:var(--ok)}
.lamp .ic{width:0.9375rem;height:0.9375rem}
.pfadbanner{display:flex;align-items:center;gap:0.75rem;margin:0.75rem 0;padding:0.625rem 0.75rem;border:2px dashed var(--chalk-dim);background:var(--bp-2)}
.pfadbanner>.ic{width:1.875rem;height:1.875rem;color:var(--amber);flex:none}
.pfadbanner{flex-wrap:wrap}
.pfadbanner .btn{flex:1 1 100%}
@media (min-width:521px){.pfadbanner .btn{flex:0 0 auto}}
.pb-tx{flex:1;min-width:0;display:flex;flex-direction:column;font-size:.92rem;line-height:1.3}
.pb-tx span{color:var(--chalk-dim)}
/* Dein Plan (nach dem Schnellcheck) und Marke „Empfohlen“ */
.plancard{margin:0.75rem 0;padding:0.75rem 0.875rem;background:var(--bp-2);border:3px double var(--amber)}
.plancard p{margin:0.25rem 0 0.5rem}
.planlist{list-style:none;margin:0;padding:0;display:grid;gap:0.25rem}
.plan-it{display:grid;grid-template-columns:1.5rem 1fr auto;column-gap:0.5rem;align-items:center;min-height:2.5rem;padding:0.125rem 0}
.plan-it .pl-ic .ic{width:1.25rem;height:1.25rem;color:var(--amber)}
.plan-it .pl-nm{display:flex;flex-direction:column;min-width:0;font-weight:600}
.plan-it .pl-nm small{font:700 .65rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.plan-it .pl-st{font:700 .68rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.plan-it.done{color:var(--chalk-dim)}
.plan-it.done .pl-ic .ic,.plan-it.done .pl-st{color:var(--ok)}
.plan-it.now .pl-nm{font-weight:700}
.pl-act{grid-column:2 / -1;display:flex;gap:0.5rem;flex-wrap:wrap;margin:0.25rem 0 0.375rem}
.mrec{padding:0.0625rem 0.375rem;background:var(--amber);color:var(--on-amber);font:700 .6rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.rail{list-style:none;margin:0.875rem 0 0;padding:0}
.rail>li{position:relative;padding:0 0 0.625rem 3rem}
.rail>li::before{content:"";position:absolute;left:1.125rem;top:0;bottom:0;border-left:3px dashed var(--grid-2)}
.rail>li:first-child::before{top:1.375rem}
.rail>li:last-child::before{bottom:auto;height:2.125rem}
.rail>li.done::before{border-left:0;width:0.1875rem;background:linear-gradient(180deg,var(--ok) 0 9px,transparent 9px) 0 0/3px 14px repeat-y;animation:flow 1s linear infinite}
.rail>li.pgrp{display:flex;align-items:center;gap:0.5rem;padding-top:0.875rem;padding-bottom:0.375rem;font:700 .75rem var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--chalk-dim)}
.rail .lamp{position:absolute;left:0.375rem;top:1.25rem}
.mod[data-acc="erw"]{--acc:var(--erw)}
.mod[data-acc="kue"]{--acc:var(--kue)}
.mod[data-acc="mix"]{--acc:var(--erw)}
.mod[data-acc="ok"]{--acc:var(--ok)}
.modbtn{width:100%;display:grid;grid-template-columns:2rem 1fr auto;gap:0.625rem;align-items:center;min-height:4.125rem;padding:0.625rem 0.75rem 0.625rem 1.25rem;text-align:left;background:var(--bp-2);color:var(--chalk);border:2px solid var(--chalk);box-shadow:inset 8px 0 0 var(--acc,var(--amber)),0 3px 0 rgba(0,0,0,.35);cursor:pointer}
.modbtn:active{transform:translateY(2px);box-shadow:inset 8px 0 0 var(--acc,var(--amber))}
.mpos{font:700 .85rem var(--font-mono);color:var(--acc,var(--amber))}
.mnm{display:flex;flex-direction:column;min-width:0}
.mnm b{font-size:1rem}
.mnm small{color:var(--chalk-dim);font-size:.8rem;line-height:1.25}
.mside{display:flex;flex-direction:column;align-items:flex-end;gap:0.1875rem}
.mtag{font:700 .62rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-dim)}
.mod.frei .modbtn{border-style:dotted}
.mod.done .mtag{color:var(--ok)}
.mod.done .lamp{background:var(--ok);border-color:var(--ok)}
.mod.next .mtag{color:var(--amber)}
.mod.next .modbtn{border-color:var(--amber);border-width:3px;padding:0.5625rem 0.6875rem 0.5625rem 1.1875rem}
.mod.next .lamp{border-color:var(--amber);background:rgba(255,197,61,.25);animation:blink 1.2s steps(2,jump-none) infinite}
.mod.locked .lamp{border-style:dashed;border-color:var(--chalk-dim);color:var(--chalk-dim)}
.mod.locked .modbtn{border-style:dashed;border-color:var(--chalk-dim);color:var(--chalk-dim);box-shadow:inset 8px 0 0 var(--grid-2)}
.mod.locked .mpos{color:var(--chalk-dim)}
.modalbtns{display:grid;gap:0.5rem;margin-top:0.75rem}
.modalcard p{margin:.4em 0}
.modalcard .btn.alt{background:var(--paper);color:var(--ink);border-color:var(--ink)}

/* ---------- 9 Menüs ---------- */
.home{max-width:45rem;margin:0 auto;padding:0.875rem 0.875rem 6rem}
.home h1{margin:1rem 0 0.625rem;font:700 1rem var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--chalk)}
.area{margin:1.375rem 0 0.5rem;font:700 .8rem var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--chalk-dim)}
.menu{display:grid;gap:0.75rem;margin:0.75rem 0}
.bigbtn{position:relative;display:flex;align-items:center;gap:1rem;min-height:6rem;padding:0.875rem 1rem;text-align:left;cursor:pointer;color:var(--chalk);background:var(--bp-2);border:2px solid var(--chalk);border-radius:2px;box-shadow:inset 12px 0 0 var(--acc,var(--amber)),0 4px 0 rgba(0,0,0,.35);padding-left:1.75rem}
.bigbtn:active{transform:translateY(3px);box-shadow:inset 12px 0 0 var(--acc,var(--amber))}
.bigbtn .ico{display:grid;place-items:center;flex:none;width:max(56px,3.5rem);height:max(56px,3.5rem);border:2px solid var(--chalk-dim);color:var(--acc,var(--amber))}
.bigbtn .ico .ic{width:2.125rem;height:2.125rem}
.bigbtn .tx{display:flex;flex-direction:column;gap:0.125rem;min-width:0}
.bigbtn b{font-size:1.2rem}
.bigbtn small{font-size:.95rem;color:var(--chalk-dim)}
.bigbtn .pg{font:600 .75rem var(--font-mono);letter-spacing:.06em}
.bigbtn[data-pat="dots"] .ico{background-image:radial-gradient(var(--grid-2) 1.6px,transparent 2.2px);background-size:9px 9px}
.bigbtn[data-pat="dash"] .ico{background-image:repeating-linear-gradient(0deg,transparent 0 8px,var(--grid-2) 8px 9px)}
.bigbtn[data-pat="hatch"] .ico{background-image:repeating-linear-gradient(45deg,var(--grid-2) 0 1.5px,transparent 1.5px 7px)}
.home>.bigbtn{width:100%}
.bigbtn.go{background:var(--amber);color:var(--on-amber);border-color:var(--amber);--acc:var(--on-amber)}
.bigbtn.go .ico{border-color:var(--on-amber);color:var(--on-amber)}
.bigbtn.go small{color:var(--on-amber)}
.bigbtn[data-acc="erw"]{--acc:var(--erw)}
.bigbtn[data-acc="kue"]{--acc:var(--kue)}
.bigbtn[data-acc="mix"]{--acc:var(--erw)}
.bigbtn[data-acc="ok"]{--acc:var(--ok)}
.bigbtn[data-acc="chalk"]{--acc:var(--chalk)}

/* Stückliste */
.bom{border:2px solid var(--chalk);background:var(--bp-2)}
.bomhead,.bomrow{display:grid;grid-template-columns:2.6rem 1fr 3.9rem 3.9rem 1.2rem;align-items:center;gap:0.5rem;padding-right:0.625rem;padding-left:0.75rem}
.bomhead{padding-left:1.25rem}
.bomhead{min-height:2.125rem;border-bottom:2px solid var(--chalk);font:700 .64rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim)}
.bomrow{width:100%;min-height:4.25rem;border:0;border-bottom:1.5px solid var(--grid-2);box-shadow:inset 8px 0 0 var(--acc,var(--amber));padding-left:1.25rem;background:none;color:var(--chalk);text-align:left;cursor:pointer}
.bomrow:last-child{border-bottom:0}
.bomrow:active{background:var(--bp-3)}
.bomrow[data-acc="erw"]{--acc:var(--erw)}
.bomrow[data-acc="kue"]{--acc:var(--kue)}
.bomrow[data-acc="mix"]{--acc:var(--erw)}
.bomrow[data-acc="chalk"]{--acc:var(--chalk)}
.bomrow .pos{font:700 .9rem var(--font-mono);color:var(--acc)}
.bomrow .nm{display:flex;flex-direction:column;min-width:0}
.bomrow .nm b{font-size:1rem}
.bomrow .nm small{color:var(--chalk-dim);font-size:.82rem;line-height:1.25}
.stars{display:inline-flex;gap:0.0625rem;color:var(--amber)}
.stars .ic{width:.95rem;height:.95rem;opacity:.35}
.stars .ic.fill{opacity:1}
.bomrow>.ic{width:1rem;height:1rem;color:var(--chalk-dim)}

/* Rangleiter und „alles perfekt“ */
.ladder{border:2px solid var(--chalk);background:var(--bp-2)}
.rung{display:grid;grid-template-columns:2rem 2.2rem 1fr 2.4rem;align-items:center;gap:0.5rem;min-height:max(56px,3.5rem);padding:0.375rem 0.625rem;border-bottom:1.5px solid var(--grid-2);color:var(--chalk-dim)}
.rung:last-child{border-bottom:0}
.rung .rn{font:700 .8rem var(--font-mono)}
.rung .ri .ic{width:1.6rem;height:1.6rem}
.rung .rt{display:flex;flex-direction:column}
.rung .rt b{font-size:1rem}
.rung .rt small{font-size:.78rem}
.rung.done{color:var(--chalk)}
.rung.done .ri{color:var(--amber)}
.rung.cur{background:rgba(255,197,61,.12);box-shadow:inset 6px 0 0 var(--amber)}
.rung .rs{display:flex;justify-content:flex-end}
.rung.done .rs{color:var(--ok)}
.sr{position:absolute;width:0.0625rem;height:0.0625rem;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.perf{border:2px solid var(--chalk);background:var(--bp-2);padding:0.625rem 0.75rem}
.perfhead{margin:0 0 0.375rem;font-weight:700}
.prow{display:grid;grid-template-columns:1.8rem 1fr auto;gap:0.5rem;align-items:center;padding:0.4375rem 0;border-top:1.5px solid var(--grid-2)}
.pm{color:var(--chalk-dim)}
.prow.done .pm{color:var(--ok)}
.pt{display:flex;flex-direction:column;gap:0.3125rem;font-size:.92rem}
.pbar{display:block;height:0.5rem;background:rgba(184,212,238,.22)}
.pbar i{display:block;height:100%;background:var(--amber)}
.prow.done .pbar i{background:var(--ok)}
.pn{min-width:3.6rem;text-align:right;font:700 .85rem var(--font-mono);color:var(--chalk-dim)}

/* Optionen (Blatt hinter dem Rang-Chip) */
.optmodal{align-items:flex-start;overflow-y:auto}
.optmodal .modalcard{max-width:27.5rem;margin:auto;text-align:left}
.optmodal h2{text-align:left}
.optrank{display:flex;align-items:center;gap:0.875rem;margin:0.375rem 0 0.625rem;padding:0.625rem 0.75rem;border:2px solid var(--ink);background:#fff}
.optrank .ic.big{width:2.6rem;height:2.6rem;flex:none;color:var(--ink)}
.optrank .orx{display:flex;flex-direction:column;gap:0.25rem;min-width:0}
.optrank b{font:700 min(1.05rem,4.4vw) var(--font-mono);letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere}
.optrank{container-type:inline-size}
@container (max-width:17rem){.optrank .ic.big{display:none}}
.optrank small{color:var(--ink-dim)}
.optrank .gseg i{background:rgba(11,42,74,.18)}
.optrank .gseg i.on{background:var(--ink)}
.optlist{display:grid;gap:0.5rem;margin:0.5rem 0}
.optbtn{display:flex;align-items:center;gap:0.75rem;width:100%;min-height:max(56px,3.5rem);padding:0.5rem 0.75rem;background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25);text-align:left;cursor:pointer}
.optbtn:active{transform:translateY(2px);box-shadow:none}
.optbtn .ot{flex:1;display:flex;flex-direction:column;min-width:0}
.optbtn small{color:var(--ink-dim)}
.optbtn>.ic:first-child{width:1.6rem;height:1.6rem}
.optsec{margin:0.75rem 0 0.25rem}
.optseg{display:grid;grid-template-columns:repeat(4,1fr);width:100%;margin-top:.4rem;border-color:var(--ink)}
.optseg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-height:3.6rem;padding:.2rem .1rem;background:var(--paper);color:var(--ink);font:700 .6rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.optseg button+button{border-left:2px solid var(--ink)}
.optseg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.optseg .az{font:700 1rem var(--font-body);letter-spacing:0;text-transform:none}
.optseg .az-s{font-size:.85rem}.optseg .az-l{font-size:1.25rem}.optseg .az-xl{font-size:1.5rem}
.optmodal .lblm{color:var(--ink-dim)}
.optsec:empty{display:none}
.optfoot{display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:space-between;margin-top:0.75rem}
.modalcard .btn.danger{color:#a32626;border-color:#a32626}
.modalcard .rowbtns{justify-content:center}

/* Hilfe bei Problemen: große Schrift, kurze Schritte, immer nur ein Eintrag offen.
   Die Karte steht oben (nicht zentriert), damit sie beim Aufklappen nicht springt. */
.techmodal .modalcard{margin:0 auto;max-width:30rem}
.techlead{margin:0.25rem 0 0.75rem;font-size:1.05rem}
.techlist{display:grid;gap:0.5rem;margin:0.5rem 0}
.tech{background:var(--paper);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tech>summary{min-height:max(56px,3.5rem);padding:0.5rem 0.75rem;cursor:pointer;list-style:none;font-weight:700;font-size:1.05rem;line-height:1.3}
.tech>summary::-webkit-details-marker{display:none}
.tech .srow{display:flex;align-items:center;gap:0.75rem;min-height:max(40px,2.5rem)}
.tech .tq{flex:1;min-width:0}
.tech .srow .ic{transition:transform .15s}
.tech[open]>summary{background:var(--mark);border-bottom:2px solid var(--ink)}
.tech[open] .srow .ic{transform:rotate(180deg)}
.tech-last{border-left:10px solid var(--amber)}
.tbody{padding:0.5rem 0.875rem 0.875rem}
.tbody p{margin:0.4em 0}
.tbody strong{background:linear-gradient(transparent 55%,var(--mark) 55%)}
.tech ol{list-style:none;counter-reset:pos;margin:0.5rem 0;padding:0}
.tech li{counter-increment:pos;position:relative;margin:0.55rem 0;padding-left:2.4rem;min-height:1.75rem}
.tech li::before{content:counter(pos);position:absolute;left:0;top:0.05rem;display:grid;place-items:center;width:1.75rem;height:1.75rem;border:2px solid var(--ink);background:#fff;font:700 .9rem var(--font-mono)}
.techact{display:flex;gap:0.5rem;flex-wrap:wrap;margin:0.75rem 0 0.25rem}
.ttip{display:flex;gap:0.5rem;align-items:flex-start;margin:0.75rem 0 0;padding:0.5rem 0.75rem;background:#fff;border:2px dashed var(--ink)}
.ttip .ic{margin-top:0.15rem}
.techstate{display:flex;align-items:flex-start;gap:0.5rem;margin:0.6rem 0;padding:0.5rem 0.75rem;border:2px solid;font-weight:700}
.techstate.ok{color:#1f7a45;border-color:#1f7a45;background:#f0faf3}
.techstate.bad{color:#a32626;border-color:#a32626;background:#fdf1f1}
.techinfo{margin:0.6rem 0;border:2px solid var(--ink);background:#fff;font:600 .9rem/1.4 var(--font-mono)}
.techinfo .tih{padding:0.25rem 0.625rem;background:var(--ink);color:var(--paper);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.techinfo .tir{display:flex;justify-content:space-between;gap:0.75rem;padding:0.3rem 0.625rem}
.techinfo .tir+.tir{border-top:1.5px solid rgba(11,42,74,.25)}
.techfoot{display:flex;justify-content:flex-end;margin-top:0.75rem}

/* Rang */
.rankcard{display:flex;align-items:center;gap:0.875rem;margin:0.375rem 0 0.75rem;padding:0.75rem 0.875rem;background:var(--bp-2);border:3px double var(--chalk)}
.rankcard .ico{display:grid;place-items:center;flex:none;width:max(58px,3.625rem);height:max(58px,3.625rem);border:2px solid var(--amber);color:var(--amber)}
.rankcard .ico .ic{width:2.25rem;height:2.25rem}
.rankcard .rk{flex:1;min-width:0;display:flex;flex-direction:column;gap:0.3125rem}
.rankcard b{font:700 1.1rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase}
.rankcard small{color:var(--chalk-dim)}
.settings{margin-top:1.25rem}
.summary table{border-collapse:collapse;margin:0.625rem 0}
.summary td{padding:0.25rem 0.875rem 0.25rem 0}
.bigstars{display:flex;gap:0.375rem;margin:.2em 0;color:var(--amber)}
.bigstars .ic{width:2rem;height:2rem;opacity:.3}
.bigstars .ic.fill{opacity:1}

/* ---------- 10 Spiele ---------- */
.memstats{display:flex;gap:1rem;flex-wrap:wrap;font:700 .8rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.memgrid{display:grid;gap:0.5rem;margin:0.75rem 0}
.memgrid.n12{grid-template-columns:repeat(4,1fr)}
.memgrid.n20{grid-template-columns:repeat(5,1fr)}
.mcard{position:relative;height:7rem;display:flex;align-items:center;justify-content:center;padding:0.375rem;overflow:hidden;font-size:1.3rem;cursor:pointer;border:2px solid var(--chalk);border-radius:2px;color:var(--ink);background:var(--paper);--cell-stroke:var(--ink);--cell-on:url(#hatch-ink);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.mcard .frac{color:var(--ink)}
.mcard.down{color:var(--chalk-dim);background:var(--bp);background-image:linear-gradient(var(--grid-2) 1px,transparent 1px),linear-gradient(90deg,var(--grid-2) 1px,transparent 1px);background-size:14px 14px;font:700 1.8rem var(--font-mono)}
.mcard.up{border-color:var(--amber);box-shadow:inset 0 0 0 3px var(--amber)}
.mcard.matched{border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--ok)}
.mcard svg{max-height:5.75rem;max-width:100%}
/* Bruch-Tresor: Code-Anzeige (Bruch mit Ziffernfeldern), Schlösser als Kontrollfelder */
.vaultcard{padding-bottom:0.875rem}
.vaultpuzzle{margin-top:0.875rem}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.vhead .stampbox{font-size:.8rem}
.vpanel{display:flex;align-items:flex-start;gap:0.875rem 1rem;margin-top:0.5rem}
.vside{display:flex;flex-direction:column;gap:0.375rem;flex:1 1 auto;min-width:0}
.vcount{white-space:nowrap}
.vside small{color:var(--chalk-dim)}
.codefrac{display:inline-flex;flex-direction:column;align-items:center;gap:0.25rem;padding:0.5rem 0.625rem;background:var(--bp);border:2px solid var(--chalk-dim);box-shadow:inset 0 0 0 2px rgba(0,0,0,.28)}
.cf-row{display:flex;gap:0.25rem}
.cf-bar{display:block;align-self:stretch;height:0.1875rem;background:var(--chalk)}
.cf-slot{display:inline-flex;align-items:center;justify-content:center;width:2.25rem;height:2.9rem;font:700 1.75rem var(--font-mono);color:var(--chalk-dim);background:var(--bp-2);border:2px solid var(--grid-2)}
.cf-slot.on{color:var(--amber);border-color:var(--amber)}
.cf-slot.cur{border-color:var(--amber);animation:blink 1.4s infinite}
.cf-slot.in{animation:slotin .5s ease-out}
@keyframes slotin{from{transform:translateY(-70%) scale(1.5);opacity:0}to{transform:none;opacity:1}}
.locks{display:flex;flex-wrap:wrap;gap:0.375rem}
.lock{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0.0625rem;min-width:max(44px,2.75rem);min-height:max(48px,3rem);padding:0.25rem 0.375rem;cursor:pointer;color:var(--chalk);background:var(--bp);border:2px solid var(--chalk-dim);border-radius:2px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.lock::before{content:"";position:absolute;top:0.1875rem;right:0.1875rem;width:0.4375rem;height:0.4375rem;border-radius:50%;background:var(--bad);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.lock.open::before{background:var(--ok)}
.lock .lk-n{font:700 .72rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--chalk-dim)}
.lock .ic{width:1.15rem;height:1.15rem}
.lock.open{border-color:var(--ok);color:var(--ok)}
.lock.locked{border-style:dashed;opacity:.55;cursor:default;box-shadow:none}
.lock.locked::before{display:none}
.lock[aria-current="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.lootlist{font-size:.9rem;color:var(--ink-dim)}
.lvlbadge{margin-left:auto;padding:0.125rem 0.5rem;border:2px solid var(--chalk-dim);font:700 .7rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim)}
.progress{display:flex;align-items:center;gap:0.625rem;margin:0.125rem 0 0.625rem}

/* ---------- 11 Anpassungen ---------- */
@media (max-width:599px){
  body{font-size:1rem}
  .topbar{padding:0.375rem 0.625rem}
  .shell{padding:0.5rem 0.5rem 0}
  .actionbar{margin-left:-0.5rem;margin-right:-0.5rem;padding:0.625rem 0.5rem calc(0.5rem + env(safe-area-inset-bottom))}
  .card{padding:0.75rem 0.75rem 0}
  .titleblock{margin:0.75rem -0.75rem 0}
  .eq{font-size:1.4rem}
  .gchip .gname,.gchip .gseg{display:none}
  .gtext{min-width:0}
  .help{left:0;right:0;bottom:0;top:auto;width:auto;max-height:82vh;transform:translateY(105%);border-left:0;border-top:3px double var(--ink)}
  .help.open{transform:none}
  .frac.inp input{width:4.4em;height:max(52px,3.25rem)}
  .cards{grid-template-columns:repeat(3,1fr)}
  .pick{min-height:4rem;font-size:1.15rem}
  .pick svg{max-width:5.625rem}
  .memgrid.n12,.memgrid.n20{grid-template-columns:repeat(3,1fr)}
  .mcard{height:6.25rem}
  .home{padding:0.625rem 0.625rem 6rem}
  .bomhead,.bomrow{grid-template-columns:2.2rem 1fr 3.4rem 3.4rem 1rem;gap:0.375rem;padding-right:0.5rem}
  .stars .ic{width:.8rem;height:.8rem}
  .stepper{margin-right:0.375rem}
  .emo{display:none}
}
@media (max-width:359px){
  .labchips{grid-template-columns:1.6rem repeat(4,1fr)}
  .labchips .lt{display:none}
  .titleblock{font-size:.6rem;letter-spacing:.06em}
  .titleblock>*{padding:0.4375rem 0.375rem}
  .eq{font-size:1.2rem}
  .frac.inp input{width:3.8em}
}
/* Hilfe bei Problemen auf schmalen Handys: weniger Rand, mehr Platz für den Text (auch bei „Sehr groß“) */
@media (max-width:419px){
  .techmodal{padding:0.625rem}
  .techmodal .modalcard{padding:1rem 0.875rem}
  .tbody{padding:0.5rem 0.625rem 0.75rem}
  .ttip{padding:0.5rem 0.625rem}
}
@media (min-width:600px){
  .split.has-visual{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (min-width:600px) and (max-width:899px) and (orientation:portrait){
  .split.has-visual{grid-template-columns:1fr}
}
@media (max-width:899px){
  .memgrid.n20{grid-template-columns:repeat(4,1fr)}
}
@media (max-height:700px){
  .labseg button{min-height:max(44px,2.75rem)}
  .labseg{margin-bottom:0.375rem}
  .lab .prompt .q{font-size:1.05rem}
  .labsay{min-height:2.4em}
  .labchips .chip{min-height:max(44px,2.75rem)}
  .labchips{margin-bottom:0.25rem}
  .labcell svg{max-width:6.75rem!important}
}
@media (orientation:landscape) and (max-height:520px){
  .tiles{grid-template-columns:repeat(4,1fr);gap:0.5rem;margin:0.5rem 0 0.25rem}
  .tiles-3{grid-template-columns:repeat(3,1fr)}
  .tile,.tiles-3 .tile{min-height:max(56px,3.5rem);font-size:1.4rem}
  .prompt::before{display:none}
  .keypad{grid-template-columns:repeat(12,1fr);gap:0.1875rem;margin-bottom:0.25rem}
  .key{min-height:max(36px,2.25rem);font-size:1.05rem}
  .primaryrow .btn{min-height:max(40px,2.5rem)}
  .topbar{min-height:max(44px,2.75rem);padding-top:0.125rem;padding-bottom:0.125rem}
  .navb{min-height:max(46px,2.875rem);flex-direction:row;gap:0.5rem}
}

/* ---------- 12 Bewegung ---------- */
@keyframes stamp{from{transform:translateY(-50%) rotate(-7deg) scale(1.7);opacity:0}to{transform:translateY(-50%) rotate(-7deg) scale(1);opacity:1}}
@keyframes stampin{from{transform:rotate(-6deg) scale(1.7);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
@keyframes blink{50%{opacity:.45}}
@keyframes flow{to{background-position:0 14px}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';
/* =====================================================================
   Bruchwerkstatt – Erweitern und Kürzen
   1 Zufall · 2 Mathematik · 3 DOM/SVG · 4 Speicher
   ===================================================================== */

/* ---------- 1 Zufall ---------- */
function makeRng(rnd){
  return {
    int:(a,b)=>a+Math.floor(rnd()*(b-a+1)),
    pick:(arr)=>arr[Math.floor(rnd()*arr.length)],
    chance:(p)=>rnd()<p,
    shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  };
}
function mulberry32(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const RNG=makeRng(Math.random);

/* ---------- 2 Mathematik (ausschließlich ganzzahlig) ---------- */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;};
const equivalent=(a,b,c,d)=>b>0&&d>0&&a*d===c*b;
const simplify=(a,b)=>{const g=gcd(a,b)||1;return [a/g,b/g];};
const canReduce=(a,b,k)=>k>1&&a%k===0&&b%k===0;
const isFullyReduced=(a,b)=>gcd(a,b)===1;
const expand=(a,b,k)=>[a*k,b*k];
const mixedToFraction=(w,a,b)=>[w*b+a,b];
const redKey=(a,b)=>{const [p,q]=simplify(a,b);return p+'/'+q;};
const smallestPrimeFactor=(n)=>{for(let p=2;p*p<=n;p++)if(n%p===0)return p;return n;};

/* Ganze Zahl aus Zeichenkette (nur Ziffern, höchstens 6 Stellen) */
function parseIntStrict(s){
  if(s==null)return null;
  s=String(s).trim();
  return /^\d{1,6}$/.test(s)?Number(s):null;
}
/* Dezimalzahl als Zeichenkette -> exakt (Zähler, 10^Stellen); Punkt oder Komma */
function parseGermanDecimal(raw){
  const s=String(raw==null?'':raw).trim().replace(/\s/g,'').replace(',','.');
  const m=/^(\d{0,9})(?:\.(\d{1,6}))?$/.exec(s);
  if(!m||(m[1]===''&&m[2]===undefined))return null;
  if(m[1]===''&&!m[2])return null;
  const fracDigits=m[2]||'';
  const places=fracDigits.length;
  const num=Number((m[1]||'0')+fracDigits);
  if(!Number.isSafeInteger(num))return null;
  return {whole:Number(m[1]||'0'),fracDigits,places,num,den:Math.pow(10,places)};
}
/* a / 10^k -> "q,rest" mit führenden Nullen (stellengetreu) */
function fractionToDecimalString(a,den){
  const places=Math.round(Math.log10(den));
  if(Math.pow(10,places)!==den)return null;
  const q=Math.floor(a/den),r=a%den;
  return places===0?String(q):q+','+String(r).padStart(places,'0');
}
const decOf=(n,places)=>fractionToDecimalString(n,Math.pow(10,places));

/* ---------- 3 DOM und SVG ---------- */
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':String(v));
  }
  for(const kid of kids.flat(Infinity)){if(kid==null||kid===false)continue;e.append(kid);}
  return e;
}
const SVGNS='http://www.w3.org/2000/svg';
function S_(tag,attrs,...kids){
  const e=document.createElementNS(SVGNS,tag);
  if(attrs)for(const k in attrs)e.setAttribute(k,String(attrs[k]));
  for(const kid of kids.flat())if(kid!=null)e.append(kid);
  return e;
}
/* Linien-Symbol aus dem Sprite (Blaupausen-Design) */
function icon(name,cls){
  const s=S_('svg',{class:'ic'+(cls?' '+cls:''),viewBox:'0 0 24 24','aria-hidden':'true',focusable:'false'});
  s.append(S_('use',{href:'#i-'+name}));
  return s;
}
/* Maßlinie mit Pfeilspitzen und Beschriftung */
function dimCap(text){return el('div',{class:'dimcap'},el('i'),el('span',null,text),el('i'));}
/* Sterne: n von max gefüllt */
function starNodes(n,max=3){
  const w=el('span',{class:'stars',role:'img','aria-label':n+' von '+max+' Sternen'});
  for(let i=0;i<max;i++)w.append(icon('stern',i<n?'fill':''));
  return w;
}
/* renderFraction(n, d): Bruch immer mit waagerechtem Bruchstrich */
function frac(n,d,cls){
  return el('span',{class:'frac'+(cls?' '+cls:''),role:'math','aria-label':n+' durch '+d},
    el('span',{class:'num'},String(n)),el('span',{class:'den'},String(d)));
}
/* renderMixed(w, n, d) */
function mixed(w,n,d){
  return el('span',{class:'mixed',role:'math','aria-label':w+' und '+n+' durch '+d},
    el('span',{class:'whole'},String(w)),frac(n,d));
}
const op=(t)=>el('span',{class:'op'},t);
function eq(...parts){
  const d=el('div',{class:'eq'});
  parts.forEach(x=>d.append(typeof x==='string'?op(x):x));
  return d;
}
const line=(...parts)=>el('div',{class:'sol-line'},...parts);
const strong=(t)=>el('strong',null,String(t));

/* ---- Bruchbilder: Streifen, Kreis, Gitter ---- */
function gridDims(d){
  for(let r=Math.floor(Math.sqrt(d));r>=2;r--)if(d%r===0)return [r,d/r];
  return null;
}
function cellShape(kind,i,d,dims,sh){
  if(kind==='strip'){const w=360/d;return S_('rect',{x:1+i*w,y:1,width:w,height:sh||56});}
  if(kind==='circle'){
    if(d===1)return S_('circle',{cx:102,cy:102,r:98});
    const a0=-Math.PI/2+i*2*Math.PI/d,a1=-Math.PI/2+(i+1)*2*Math.PI/d,r=98,c=102;
    const x0=c+r*Math.cos(a0),y0=c+r*Math.sin(a0),x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1);
    return S_('path',{d:`M${c} ${c} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${(a1-a0)>Math.PI?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`});
  }
  const [rows,cols]=dims,cs=Math.min(48,360/cols),r=Math.floor(i/cols),c=i%cols;
  return S_('rect',{x:1+c*cs,y:1+r*cs,width:cs,height:cs});
}
/* Gemeinsame Zeichenfunktion. filled: Set mit Indizes. opts.onToggle(i)->neuer Zustand */
function drawCells(kind,d,dims,filled,opts={}){
  let vb,maxW;
  const sh=opts.tall?110:56; /* hohe Streifen für kleine Karten */
  if(kind==='strip'){vb='0 0 362 '+(sh+2);maxW=opts.maxW||460;}
  else if(kind==='circle'){vb='0 0 204 204';maxW=opts.maxW||210;}
  else{const [rows,cols]=dims,cs=Math.min(48,360/cols);vb=`0 0 ${cols*cs+2} ${rows*cs+2}`;maxW=opts.maxW||(cols*cs*1.3+2);}
  const svg=S_('svg',{viewBox:vb,class:'fracsvg',role:'img','aria-label':opts.label||'Bruchbild'});
  svg.style.maxWidth=(maxW/16).toFixed(3)+'rem';
  if(maxW<=150)svg.classList.add('sm'); /* kleine Bilder: Linien in fester Stärke, damit man die Teile zählen kann */
  if(opts.onToggle)svg.classList.add('interactive');
  for(let i=0;i<d;i++){
    const on=filled.has(i);
    const g=S_('g',{class:'cell'+(on?' on':'')},cellShape(kind,i,d,dims,sh));
    if(opts.onToggle){
      g.setAttribute('role','button');g.setAttribute('tabindex','0');
      g.setAttribute('aria-pressed',String(on));g.setAttribute('aria-label','Teil '+(i+1));
      const fire=()=>{const s=opts.onToggle(i);if(typeof s==='boolean'){g.classList.toggle('on',s);g.setAttribute('aria-pressed',String(s));}};
      let down=false;
      g.addEventListener('pointerdown',()=>{down=true;});
      g.addEventListener('pointerup',e=>{if(down){down=false;e.preventDefault();fire();}});
      g.addEventListener('pointercancel',()=>{down=false;});
      g.addEventListener('pointerleave',()=>{down=false;});
      g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fire();}});
    }
    svg.append(g);
  }
  if(opts.onToggle)svg.removeAttribute('role');
  return svg;
}
const firstN=(n)=>new Set(Array.from({length:n},(_,i)=>i));
/* Welche Teile gefärbt sind: opts.filled (Set, z. B. „Dein Bild“) vor opts.fill (gespeicherte Indexliste) vor den ersten n.
   Fehlt die Liste (alter Spielstand) oder ist sie ungültig, werden die ersten n gefärbt. */
const validFill=(a,n,d)=>Array.isArray(a)&&a.length===n&&a.every(i=>Number.isInteger(i)&&i>=0&&i<d)&&new Set(a).size===n;
function fillOf(n,d,opts){
  if(opts&&opts.filled)return opts.filled;
  if(opts&&validFill(opts.fill,n,d))return new Set(opts.fill);
  return firstN(n);
}
/* n gefärbte von d Teilen als sortierte Indexliste: mit Wahrscheinlichkeit pClassic die ersten n (das bekannte Bild),
   sonst 1–3 Gruppen mit Lücken dazwischen (Kreis: zusätzlich gedreht, auch über 12 Uhr) – nie gleich „die ersten n“.
   So lässt sich Gleichheit nicht am Umriss erkennen, man muss zählen oder rechnen. Zufall nur aus R; beim Erzeugen
   der Aufgabe aufrufen (und als Liste speichern), nie beim Zeichnen. */
function scatterFill(n,d,kind,R,o){
  o=o||{};
  const first=()=>Array.from({length:n},(_,i)=>i);
  if(n<=0||n>=d||R.chance(o.pClassic||0))return first();
  const circ=kind==='circle';
  const cap=o.maxGroups||((kind==='strip'&&d>8)?2:3); /* kleine Streifenzellen: höchstens 2 Gruppen */
  const maxG=Math.min(cap,n,circ?d-n:d-n+1);
  const split=(total,parts,min)=>{const a=Array(parts).fill(min);for(let k=total-parts*min;k>0;k--)a[R.int(0,parts-1)]++;return a;};
  const weights=[1,2,1].slice(0,maxG);
  for(let t=0;t<30;t++){
    let g=1,r=R.int(1,weights.reduce((x,y)=>x+y,0));
    for(let k=0;k<weights.length;k++){if(r<=weights[k]){g=k+1;break;}r-=weights[k];}
    const parts=split(n,g,1),cells=[];
    if(circ){
      const gaps=split(d-n,g,1),rot=R.int(0,d-1);
      let pos=0;
      parts.forEach((len,j)=>{for(let i=0;i<len;i++)cells.push((pos+i+rot)%d);pos+=len+gaps[j];});
    }else{
      /* Lücken vorn, zwischen den Gruppen (mindestens 1) und hinten: erst 1 je innere Lücke, den Rest frei verteilen */
      const gap=Array(g+1).fill(0);
      for(let j=1;j<g;j++)gap[j]=1;
      for(let k=d-n-(g-1);k>0;k--)gap[R.int(0,g)]++;
      let pos=gap[0];
      parts.forEach((len,j)=>{for(let i=0;i<len;i++)cells.push(pos+i);pos+=len+gap[j+1];});
    }
    cells.sort((x,y)=>x-y);
    if(cells.some((c,i)=>c!==i))return cells;
  }
  return Array.from({length:n},(_,i)=>i+1);
}
function drawFractionStrip(n,d,opts){return drawCells('strip',d,null,fillOf(n,d,opts),opts);}
function drawFractionCircle(n,d,opts){return drawCells('circle',d,null,fillOf(n,d,opts),opts);}
function drawFractionGrid(n,d,rows,cols,opts){return drawCells('grid',d,[rows,cols],fillOf(n,d,opts),opts);}
/* Darstellung nach Modus (strip | circle | grid) */
function drawMode(mode,n,d,opts){
  if(mode==='circle')return drawFractionCircle(n,d,opts);
  if(mode==='grid'){const dm=gridDims(d)||[1,d];return drawFractionGrid(n,d,dm[0],dm[1],opts);}
  return drawFractionStrip(n,d,opts);
}
/* Rechteckeinteilung nur, wenn Zeilen und Spalten gut lesbar bleiben (höchstens 9 je Richtung) */
function gridOK(d){const g=gridDims(d);return !!g&&Math.max(g[0],g[1])<=9;}
/* Darstellung nach Nenner: Streifen und Kreis nur mit kleinen Nennern (bis 12),
   große Nenner nur als Rechteckeinteilung */
function pickMode(d,R,max){
  const m=[],lim=max||36;
  if(d<=12){m.push('strip');if(d>=2)m.push('circle');}
  if(d>=4&&d<=lim&&gridOK(d))m.push('grid');
  return m.length?R.pick(m):null;
}

/* ---------- 4 Speicher ---------- */
const KEY='bruchwerkstatt_v1';
const Store={
  ok:true,
  load(){
    try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.v===1)return o;}}
    catch(e){this.ok=false;}
    return null;
  },
  save(o){
    try{localStorage.setItem(KEY,JSON.stringify(o));}
    catch(e){this.ok=false;}
  },
  clear(){try{localStorage.removeItem(KEY);}catch(e){this.ok=false;}}
};
const defaultState=()=>({v:1,levelByType:{},rounds:{},progress:{},games:{},skills:{},lab:null,passed:{},checked:{},days:{},perfect:{},ui:{size:'m'},view:{kind:'home'}});
let S=Object.assign(defaultState(),Store.load()||{});
function persist(){Store.save(S);}

/* =====================================================================
   5 Merkkästen M1–M6 und Hilfetexte
   ===================================================================== */
const RULE2='Beide Zahlen gerade? Dann geht ÷2 – die 2 geht IMMER!';
const RULE510='Endet beides auf 0 oder 5: ÷5. Endet beides auf 0: ÷10. Und die 2 geht IMMER, wenn beide gerade sind.';

function figStrip(n,d){return el('div',{class:'fig'},frac(n,d),drawFractionStrip(n,d,{maxW:300}));}

const NOTE_EX={
  M1:[{p:2,q:3,ks:[1,2,4]},{p:1,q:2,ks:[1,2,4]},{p:3,q:4,ks:[1,2,3]},{p:3,q:5,ks:[1,2,3]},{p:1,q:3,ks:[1,2,3]}],
  M2:[{a:3,b:5,k:2},{a:1,b:4,k:3},{a:5,b:6,k:2},{a:4,b:9,k:2},{a:2,b:7,k:3}],
  M3:[{a:12,b:18,k:3},{a:15,b:20,k:5},{a:16,b:24,k:8},{a:18,b:30,k:6},{a:14,b:21,k:7}],
  M4:['7/10','35/100','7/1000','125/100','3/10','9/100','43/1000','205/100'],
  M5:['0,6','0,04','1,25','0,9','0,07','2,5','0,125','3,05'],
  M6:[[2,3,4],[3,1,2],[1,2,5],[4,3,7]]
};
const pickEx=(list,keyFn,avoid)=>list.find(x=>!avoid.includes(keyFn(x)))||list[list.length-1];

const NOTES={
  M1:{title:'Brüche mit gleichem Wert',build(avoid){
    const e=pickEx(NOTE_EX.M1,x=>x.p+'/'+x.q,avoid);
    const terms=e.ks.map(k=>[e.p*k,e.q*k]);
    const chain=[];terms.forEach((t,i)=>{if(i)chain.push('=');chain.push(frac(t[0],t[1]));});
    return [
      el('p',null,'Drei Bilder können denselben Anteil einer Fläche zeigen, auch wenn sie unterschiedlich eingeteilt sind. Dieser Anteil kann durch verschiedene Brüche angegeben werden. Diese Brüche haben ',strong('denselben Wert'),'.'),
      el('div',{class:'ex'},strong('Beispiel: '),eq(...chain)),
      el('div',{class:'figrow'},terms.map(t=>figStrip(t[0],t[1]))),
      el('p',null,strong('Merke: '),'Der Wert eines Bruchs hängt vom Anteil ab, nicht davon, in wie viele Teile die Fläche eingeteilt wurde. Es kommt nur darauf an, wie viel gefärbt ist – nicht, wo die gefärbten Teile liegen.')
    ];}},
  M2:{title:'Erweitern eines Bruchs',build(avoid){
    const e=pickEx(NOTE_EX.M2,x=>redKey(x.a,x.b),avoid);
    return [
      el('p',null,'Ein Bruch wird ',strong('erweitert'),', wenn man seinen ',strong('Zähler und seinen Nenner mit derselben natürlichen Zahl (Erweiterungszahl) multipliziert'),'.'),
      el('p',null,strong('Der Wert des Bruchs ändert sich dabei nicht.')),
      el('div',{class:'ex'},strong('Beispiel: '),eq(frac(e.a,e.b),'=',frac(e.a+' · '+e.k,e.b+' · '+e.k),'=',frac(e.a*e.k,e.b*e.k))),
      el('div',{class:'figrow'},figStrip(e.a,e.b),figStrip(e.a*e.k,e.b*e.k))
    ];}},
  M3:{title:'Kürzen eines Bruchs',build(avoid){
    const e=pickEx(NOTE_EX.M3,x=>redKey(x.a,x.b),avoid);
    return [
      el('p',null,'Ein Bruch wird ',strong('gekürzt'),', wenn man seinen ',strong('Zähler und seinen Nenner durch dieselbe natürliche Zahl (Kürzungszahl) dividiert'),'.'),
      el('p',null,strong('Der Wert des Bruchs ändert sich dabei nicht.')),
      el('div',{class:'ex'},strong('Beispiel: '),eq(frac(e.a,e.b),'=',frac(e.a+' : '+e.k,e.b+' : '+e.k),'=',frac(e.a/e.k,e.b/e.k))),
      el('p',null,strong('So weit wie möglich gekürzt: '),'Zähler und Nenner können nicht mehr beide durch dieselbe natürliche Zahl größer als 1 geteilt werden.'),
      el('div',{class:'rule'},strong('Schnelle Teilbarkeits-Tipps: '),RULE2,' ',el('br'),'Enden Zähler und Nenner beide auf 0 oder 5, geht auch die 5. Enden beide auf 0, geht auch die 10.')
    ];}},
  M7:{title:'Teilbarkeitsregeln',build(avoid){
    return [el('p',null,'So erkennst du schnell, ob du kürzen kannst:'),

const MSG_FRAC_INVALID='Trage in beide Felder eine ganze Zahl ein (Nenner größer als 0).';

function getInt(draft,key){return parseIntStrict(draft[key]);}
function getFrac(draft,key){
  const n=parseIntStrict(draft[key+'.n']),d=parseIntStrict(draft[key+'.d']);
  return (n===null||d===null||d===0)?null:{n,d};
}
const invalid=(msg)=>({correct:false,invalid:true,errorCode:'invalid',feedback:msg});
const wrong=(code,msg,marks)=>({correct:false,errorCode:code,feedback:msg,marks});
/* „Fast“: Der Wert stimmt, aber die verlangte Form noch nicht (wird freundlicher angezeigt als ein Fehler) */
const soft=(code,msg,marks)=>({correct:false,soft:true,errorCode:code,feedback:msg,marks});
const right=(msg,norm)=>({correct:true,errorCode:null,feedback:msg,normalizedAnswer:norm});

/* ---- Eingabe-Bausteine ---- */
function digitsOnly(i){i.value=i.value.replace(/\D/g,'');}
function fracInput(view,key){
  const mk=(part,label)=>{

    i.value=view.draft[k]!=null?view.draft[k]:'';
    i.disabled=view.locked();
    i.addEventListener('input',()=>{digitsOnly(i);view.draft[k]=i.value;i.classList.remove('bad','good');view.save();});

  return el('span',{class:'frac inp',role:'group','aria-label':'Bruch eingeben'},
    el('span',{class:'num'},mk('n','Zähler')),el('span',{class:'den'},mk('d','Nenner')));
}
function intInput(view,key,label){
  const i=el('input',{type:'text',class:'intin',inputmode:'none',pattern:'[0-9]*',autocomplete:'off',spellcheck:'false',maxlength:'6','aria-label':label||'Zahl'});
  i.value=view.draft[key]!=null?view.draft[key]:'';
  i.disabled=view.locked();
  i.addEventListener('input',()=>{digitsOnly(i);view.draft[key]=i.value;i.classList.remove('bad','good');view.save();});
  view.inputs[key]=i;
  return i;
}
function decInput(view,key){
  const i=el('input',{type:'text',class:'decin',inputmode:'none',autocomplete:'off',spellcheck:'false',maxlength:'12',placeholder:'0,0','aria-label':'Dezimalzahl'});
  i.value=view.draft[key]!=null?view.draft[key]:'';
  i.disabled=view.locked();
  i.addEventListener('input',()=>{
    let v=i.value.replace(/\./g,',').replace(/[^\d,]/g,'');
    const p=v.indexOf(',');if(p>=0)v=v.slice(0,p+1)+v.slice(p+1).replace(/,/g,'');
    i.value=v;view.draft[key]=v;i.classList.remove('bad','good');view.save();
  });
  view.inputs[key]=i;
  return i;
}
function stepper(view,label,get,set,min,max){
  const out=el('output',{'aria-live':'polite'});
  const minus=el('button',{type:'button','aria-label':label+' verringern'},'−');
  const plus=el('button',{type:'button','aria-label':label+' erhöhen'},'+');
  const mx=()=>typeof max==='function'?max():max;
  const upd=()=>{out.textContent=get();minus.disabled=view.locked()||get()<=min;plus.disabled=view.locked()||get()>=mx();};
  minus.addEventListener('click',()=>{if(!view.locked()&&get()>min){set(get()-1);}});
  plus.addEventListener('click',()=>{if(!view.locked()&&get()<mx()){set(get()+1);}});
  const box=el('span',{class:'stepper'},el('span',{class:'lab'},label),minus,out,plus);
  box.upd=upd;upd();
  return box;
}

/* Allgemeine Diagnose für Erweitern/Kürzen: liefert nur zutreffende Hinweise */
function diagOps(a,b,n,d,mode){
  const verb=mode==='expand'?'Erweitern':'Kürzen';
  if(n===a&&d!==b)return wrong('onlyDen',`Beim ${verb} müssen Zähler und Nenner verändert werden. Du hast nur den Nenner verändert.`);
  if(d===b&&n!==a)return wrong('onlyNum',`Beim ${verb} müssen Zähler und Nenner verändert werden. Du hast nur den Zähler verändert.`);
  if(n===a&&d===b)return wrong('same',`Der Bruch ist unverändert. Beim ${verb} müssen sich Zähler und Nenner ändern.`);
  if(!equivalent(a,b,n,d))return wrong('diffFactors','Prüfe, ob du oben und unten dieselbe Zahl verwendet hast. Der Wert des Bruchs hat sich verändert.');
  return null;
}

const TASKS={};

/* ---------- G01 Gleiche Anteile erkennen ---------- */
TASKS.G01={area:'Grundlagen',name:'Gleiche Anteile erkennen',desc:'Finde die Bilder und Brüche, die denselben Anteil zeigen.',notes:['M1'],size:5,
  gen(level,R){
    let p,q,k0;
    do{q=level===1?R.pick([2,3,4,5,6]):R.int(3,9);p=R.int(1,q-1);}while(gcd(p,q)!==1);
    k0=level===1?1:R.int(2,4);
    const a=p*k0,b=q*k0,maxK=level===1?4:7,dmax=level===1?24:63,total=level===1?5:6;
    const equal=Array.from({length:maxK},(_,i)=>i+1).filter(k=>k!==k0&&q*k<=dmax).map(k=>[p*k,q*k]);
    /* Die Zahl der richtigen Karten wechselt: leicht 1–3, knifflig 1–4 */
    const nCorrect=Math.min(equal.length,R.pick(level===1?[1,2,2,3]:[1,2,3,3,4]));
    const correct=R.shuffle(equal).slice(0,nCorrect);
    /* typische Fehlvorstellungen als Gegenkarten */
    const dist=[],pool=[];
    const same=(x,n,d)=>x[0]===n&&x[1]===d;
    const add=(n,d)=>{if(n>=1&&d>n&&d<=dmax&&!equivalent(a,b,n,d)&&!pool.some(x=>same(x,n,d)))pool.push([n,d]);};
    [[a+1,b],[a-1,b],[b-a,b],[a,b*2],[a,b+1],[p,q+1],[p+1,q+1],[p+1,q],[a+k0,b+1],[b-a+1,b+1]].forEach(c=>add(c[0],c[1]));
    [2,3,4].forEach(k=>{add(p*k+1,q*k);add(p*k-1,q*k);add(p*k,q*k+1);});
    for(const c of R.shuffle(pool)){if(dist.length>=total-nCorrect)break;dist.push(c);}
    /* Darstellung: Streifen und Kreis nur bei kleinen Nennern, große Nenner nur als Rechteckeinteilung */
    /* Gefärbte Teile verstreut oder verschoben (nur bei Bildern); ein Teil der Bilder bleibt klassisch zusammenhängend */
    const pC=level===1?0.3:0.1;
    const withFill=(f)=>{if(f.mode!=='num')f.fill=scatterFill(f.n,f.d,f.mode,R,{pClassic:pC});return f;};
    const mk=([n,d])=>{
      const m=pickMode(d,R);
      return withFill({n,d,mode:(m&&R.chance(level===1?0.5:(d>12?0.6:0.35)))?m:'num'});
    };
    const cards=R.shuffle(correct.concat(dist)).map(mk);
    const tm=level===1?(pickMode(b,R)||'strip'):'num';
    return {type:'G01',level,target:withFill({n:a,d:b,mode:tm}),cards,avoid:[redKey(a,b)]};
  },
  prompt(t,h){
    const n=t.cards.filter(c=>equivalent(c.n,c.d,t.target.n,t.target.d)).length;
    h.append(el('p',{class:'q'},t.level===1?'Welche Karten zeigen denselben Anteil wie das Bild?':['Welche Karten sind gleich viel wert wie ',frac(t.target.n,t.target.d),'?'],' ',el('b',null,'(Es gibt '+n+' richtige.)')));
  },
  render(view,host){
    const t=view.task,d=view.draft;d.sel=d.sel||[];
    const tg=el('figure',{class:'fig',style:'max-width:12.5rem'});
    if(t.target.mode!=='num')tg.append(drawMode(t.target.mode,t.target.n,t.target.d,{label:'Vorgabe',maxW:150,fill:t.target.fill}));
    const cards=el('div',{class:'cards',role:'group','aria-label':'Karten'});
    t.cards.forEach((c,i)=>{
      const b=el('button',{type:'button',class:'pick','aria-pressed':String(d.sel.includes(i)),'aria-label':c.mode==='num'?`Karte ${i+1}: ${c.n} durch ${c.d}`:`Karte ${i+1}: Bruchbild`},
        c.mode==='num'?frac(c.n,c.d):drawMode(c.mode,c.n,c.d,{maxW:110,label:'Bruchbild',tall:true,fill:c.fill}));
      b.disabled=view.locked();
      b.addEventListener('click',()=>{
        if(view.locked())return;
        const j=d.sel.indexOf(i);if(j>=0)d.sel.splice(j,1);else d.sel.push(i);
        b.setAttribute('aria-pressed',String(d.sel.includes(i)));view.save();
      });
      view.inputs['c'+i]=b;cards.append(b);
    });
    host.append(...(tg.firstChild?[tg]:[]),cards);
  },
  validate(t,d){
    const sel=d.sel||[];
    if(!sel.length)return invalid('Wähle mindestens eine Karte aus.');
    const ok=i=>equivalent(t.cards[i].n,t.cards[i].d,t.target.n,t.target.d);
    const wr=sel.filter(i=>!ok(i)),miss=t.cards.map((_,i)=>i).filter(i=>ok(i)&&!sel.includes(i));
    if(!wr.length&&!miss.length)return right('Richtig! Alle diese Karten zeigen denselben Anteil – nur die Einteilung ist verschieden.');
    if(wr.length){
      const sameParts=wr.some(i=>t.cards[i].d===t.target.d);
      return wrong('wrongCard',sameParts?'Eine gewählte Karte hat gleich viele Teile, zeigt aber einen anderen Anteil. Die Anzahl der Teile allein genügt nicht: Der Anteil der gefärbten Fläche entscheidet.':'Mindestens eine gewählte Karte zeigt einen anderen Anteil. Vergleiche die gefärbten Anteile.');
    }
    return soft('missing','Das stimmt bisher – aber es gibt noch mehr passende Karten.');
  },
  solution(t){
    const box=[];
    t.cards.forEach((c,i)=>{
      if(equivalent(c.n,c.d,t.target.n,t.target.d))box.push(line(`Karte ${i+1}: `,frac(c.n,c.d),' – ',relationText(t.target.n,t.target.d,c.n,c.d)));
    });
    box.push(line('Alle anderen Karten zeigen einen anderen Anteil, auch wenn der Nenner oder der Zähler gleich sein kann.'));
    return box;
  },
  hints(t){return HINT.equal.map(x=>[x]);}
};
function relationText(a,b,c,d){
  if(c%a===0&&d%b===0&&c/a===d/b&&c/a>1)return `erweitert mit ${c/a}`;
  if(a%c===0&&b%d===0&&a/c===b/d&&a/c>1)return `gekürzt mit ${a/c}`;
  return `Kreuzprobe: ${a} · ${d} = ${a*d} und ${c} · ${b} = ${c*b}`;
}

TASKS.G02={area:'Grundlagen',name:'Erweitern',desc:'Erweitere Brüche mit einer vorgegebenen Zahl.',notes:['M2'],size:5,

    if(level===1){b=R.int(2,9);a=R.int(1,b-1);k=R.pick([2,3,4,5]);}
    else{b=R.int(5,25);a=R.chance(0.2)?R.int(b+1,2*b):R.int(2,b-1);k=R.pick([6,7,8,9,11,12]);if(R.chance(0.3))mode='target';}
    return {type:'G02',level,mode,a,b,k,avoid:[redKey(a,b),redKey(a*k,b*k)]};
  },
  prompt(t,h){
    h.append(t.mode==='factor'?el('p',{class:'q'},'Erweitere den Bruch ',frac(t.a,t.b),' mit ',strong(t.k),'.')
      :el('p',{class:'q'},'Erweitere den Bruch ',frac(t.a,t.b),' so, dass der Nenner ',strong(t.b*t.k),' entsteht.'));

    const g=diagOps(t.a,t.b,f.n,f.d,'expand');if(g){g.marks=m;return g;}
    if(equivalent(t.a,t.b,f.n,f.d))return soft('wrongFactor',t.mode==='factor'?`Der Wert stimmt, aber du solltest mit ${t.k} erweitern.`:`Der Wert stimmt, aber der neue Nenner soll ${dd} sein.`,m);
