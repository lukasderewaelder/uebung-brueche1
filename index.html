/* Ergebnis des Schnellchecks (Q00) und des Kurztests (Q01) */
function renderQuickSummary(main,id,lvl,key,round){
  const info=round.info||{};
  const right=round.results.filter(r=>r==='f'||r==='l').length,share=right/round.size;
  const again=()=>{S.rounds[key]={results:[],cur:null,size:TASKS[id].size};persist();renderAll();};
  const btn=(label,fn,primary)=>el('button',{type:'button',class:'btn'+(primary?' primary':''),onclick:fn},label);
  const toPfad=()=>go({kind:'home',tab:'pfad'});
  const stars=bigStars(share>=0.9?3:share>=0.7?2:share>=0.4?1:0);
  if(id==='Q01'){
    const q=info.quiz||{},st=q.station||S.quizFor,name=st?stationTitle(st):'das Bauteil',ok=!!q.passed;
    main.append(el('div',{class:'card summary'},
      el('div',{class:'stampbox'},ok?'Kurztest bestanden':'Noch nicht'),el('p',null),stars,
      el('p',null,`${right} von ${round.size} richtig`),
      el('p',null,ok?name+' ist geschafft (per Check). Es geht weiter.':'Du brauchst '+needOf(round.size)+' von '+round.size+' richtig. Übe zuerst das Bauteil – dann klappt es.'),
      el('div',{class:'rowbtns'},...(ok?[btn('Weiter im Lernpfad',toPfad,true)]:[btn('Zum Bauteil',()=>openStation(st),true),btn('Nochmal',again),btn('Zum Lernpfad',toPfad)]))));
    return;
  }
  /* Schnellcheck (Q00): Ergebnis je nach Stufe – von vorn beginnen, Themenliste oder fit */
  const ev=info.ev||qEvaluate(round.results,round.sk,round.size,true); /* Runden ohne info.ev: aus den Antworten rechnen */
  const per={};
  round.results.forEach((r,i)=>{const sk=(round.sk||[])[i];if(sk)(per[sk]=per[sk]||[]).push(r==='f'||r==='l');});
  if(ev.stufe==='start'){
    main.append(el('div',{class:'card summary'},
      el('div',{class:'stampbox'},'Check fertig'),el('p',null),
      el('p',null,`${right} von ${round.size} richtig`),
      el('p',null,'Das war noch schwer. Das ist ganz normal.'),
      el('p',null,'Im Lernpfad lernst du alles Schritt für Schritt. Fang vorn an: Erst probierst du im Bruchlabor aus.'),
      el('div',{class:'rowbtns'},btn('Lernpfad von vorn beginnen',()=>openStation('LAB'),true),btn('Nochmal',again))));
    return;
  }
  /* Fähigkeiten in Lernpfad-Reihenfolge */
  const pathIx=(sk)=>PATH.findIndex(m=>m.id===Q_STATION[sk]);
  const order=Q_SKILLS.filter(sk=>per[sk]).sort((a,b)=>pathIx(a)-pathIx(b));
  const rows=order.map(sk=>{
    const x=ev.skills[sk];
    return el('tr',null,
      el('td',null,per[sk].map(ok=>el('span',{class:'qm '+(ok?'ok':'bad'),role:'img','aria-label':ok?'richtig':'falsch'},icon(ok?'haken':'kreuz')))),
      el('td',null,Q_SKILL_NAME[sk]),
      el('td',{class:x.status==='sitzt'?'sits':'ueben'},el('b',null,x.status==='sitzt'?'sitzt':x.status==='fast'?'fast':'üben')));
  });
  const placed=(info.placed||[]).map(stationTitle);
  const plan=planOf();
  const lines=[];
  if(info.final)lines.push('Urkunde! Du hast den Lernpfad geschafft.');
  else{
    if(ev.stufe==='fit')lines.push('Du bist fit!');
    if(placed.length)lines.push('Per Check fertig: '+placed.join(', ')+'.');
    if(plan){
      lines.push((ev.stufe==='fit'?'Noch offen: ':'Das solltest du üben: ')+plan.items.filter(it=>!it.done).map(it=>stationTitle(it.id)).join(', ')+'.');
      if(plan.items.some(it=>!it.done&&it.status==='fast'))lines.push('Bei „fast“ kannst du es mit dem Kurztest versuchen.');
    }else if(!placed.length)lines.push('Alles sitzt – stark!');
    if(info.ready&&!info.passed)lines.push('Für die Urkunde brauchst du '+needOf(round.size)+' von '+round.size+' richtig.');
  }
  const btns=[];
  const nowIt=plan&&plan.now;
  if(nowIt){
    const nm=stationTitle(nowIt.id);
    btns.push(nowIt.status==='fast'&&PATH_SKILLS[nowIt.id]?btn('Kurztest: '+nm,()=>startKurztest(nowIt.id),true):btn('Mit '+nm+' beginnen',()=>openStation(nowIt.id),true),btn('Zum Lernpfad',toPfad));
  }else btns.push(btn('Weiter im Lernpfad',toPfad,true));
  if(order.every(sk=>ev.skills[sk].status==='sitzt')&&lvl===1)btns.push(btn('Knifflig probieren',()=>setLevel(id,2)));
  btns.push(btn('Nochmal',again));
  main.append(el('div',{class:'card summary'},
    el('div',{class:'stampbox'},'Check fertig'),el('p',null),stars,
    el('p',null,`${right} von ${round.size} richtig · ${LEVEL_LABEL[lvl]}`),
    el('table',{class:'qsum'},...rows),
    ...lines.map(x=>el('p',null,x)),
    el('div',{class:'rowbtns'},...btns)));
}

/* =====================================================================
   8 Spiel S01 – Bruch-Memory
   ===================================================================== */
function memoryFace(n,d,mode,R,level){
  const f={n,d,mode};
  if(mode!=='num'&&R)f.fill=scatterFill(n,d,mode,R,{pClassic:level===1?0.3:0.1}); /* gefärbte Teile verstreut oder verschoben */
  return f;
}
function genMemoryPairs(level,count,R){
  const used=new Set(),pairs=[],maxQ=level===1?8:12;
  const memoryFaceR=(n,d,mode)=>memoryFace(n,d,mode,R,level);
  const sameFace=(a,b)=>a.mode===b.mode&&a.n===b.n&&a.d===b.d;
  let guard=0;
  while(pairs.length<count&&guard++<2000){
    const q=R.int(2,maxQ),p=R.int(1,q-1);
    if(gcd(p,q)!==1||used.has(p+'/'+q))continue;
    let a,b;
    if(level===1){
      const kind=R.pick(['pic','pic','num']);
      if(kind==='num'){const k=R.int(2,5);a=memoryFaceR(p,q,'num');b=memoryFaceR(p*k,q*k,'num');}
      else{
        const k1=R.int(1,2),k2=R.pick([1,2,3,4].filter(x=>x!==k1));
        const m=pickMode(q*k1,R,24);if(!m)continue;
        a=memoryFaceR(p*k1,q*k1,m);b=memoryFaceR(p*k2,q*k2,'num');
      }
    }else{
      const kind=R.pick(['num','num','pic','picpic','red']);
      const ks=R.shuffle([1,2,3,4,5,6,7,8,9]);
      if(kind==='num'){a=memoryFaceR(p*ks[0],q*ks[0],'num');b=memoryFaceR(p*ks[1],q*ks[1],'num');}
      else if(kind==='red'){const k=R.int(4,9);a=memoryFaceR(p*k,q*k,'num');b=memoryFaceR(p,q,'num');}
      else if(kind==='pic'){
        const m=pickMode(q*ks[0],R,24);if(!m)continue;
        a=memoryFaceR(p*ks[0],q*ks[0],m);b=memoryFaceR(p*ks[1],q*ks[1],'num');
      }else{
        const m1=pickMode(q*ks[0],R,24),m2=pickMode(q*ks[1],R,24);if(!m1||!m2)continue;
        a=memoryFaceR(p*ks[0],q*ks[0],m1);b=memoryFaceR(p*ks[1],q*ks[1],m2);
      }
    }
    if(sameFace(a,b))continue;
    used.add(p+'/'+q);pairs.push(R.chance(0.5)?[a,b]:[b,a]);
  }
  return pairs;
}
function newMemory(level){
  const pairs=genMemoryPairs(level,level===1?6:10,RNG);
  const cards=[];
  pairs.forEach((pr,i)=>{cards.push({pair:i,face:pr[0],state:'down'});cards.push({pair:i,face:pr[1],state:'down'});});
  return {level,cards:RNG.shuffle(cards),first:null,attempts:0,hints:0,hintStage:0,done:false};
}
function gameRec(key){return S.games[key]||(S.games[key]={state:null,played:0,won:0,best:null});}

  const m=rec.state;

  const updStats=()=>{
    const found=m.cards.filter(c=>c.state==='matched').length/2;
    stats.replaceChildren(el('span',null,`Gefundene Paare: ${found} von ${m.cards.length/2}`),el('span',null,`Versuche: ${m.attempts}`),el('span',null,`Tipps: ${m.hints}`));
  };
  const faceNode=(c)=>c.face.mode==='num'?frac(c.face.n,c.face.d):drawMode(c.face.mode,c.face.n,c.face.d,{maxW:100,label:'Bruchbild',tall:true,fill:c.face.fill});
  const draw=()=>{
    grid.replaceChildren();
    m.cards.forEach((c,i)=>{
      const down=c.state==='down';
      const b=el('button',{type:'button',class:'mcard '+c.state,'aria-label':down?`Karte ${i+1}, verdeckt`:(c.face.mode==='num'?`Karte ${i+1}: ${c.face.n} durch ${c.face.d}`:`Karte ${i+1}: Bruchbild`)},down?'?':faceNode(c));
      b.addEventListener('click',()=>flip(i));
      grid.append(b);
    });
    updStats();
  };
  const flip=(i)=>{
    if(busy||m.done)return;
    const c=m.cards[i];if(c.state!=='down')return;
    c.state='up';
    if(m.first===null){m.first=i;draw();persist();return;}
    const f=m.cards[m.first];m.attempts++;
    if(f.pair===c.pair){
      f.state=c.state='matched';m.first=null;
      if(m.cards.every(x=>x.state==='matched')){
        m.done=true;rec.won++;rec.best=rec.best==null?m.attempts:Math.min(rec.best,m.attempts);
        award(30,'Memory geschafft!');msg.replaceChildren(el('div',{class:'msg ok'},`Geschafft! Du hast alle ${m.cards.length/2} Paare in ${m.attempts} Versuchen gefunden.`));fillStats();
      }
      draw();persist();
    }else{
      busy=true;draw();
      setTimeout(()=>{f.state='down';c.state='down';m.first=null;busy=false;if(document.getElementById('memhost')===grid)draw();persist();},1100);
    }
  };
  hintBtn.addEventListener('click',()=>{if(m.hintStage<HINT.memory.length){m.hintStage++;m.hints++;m.hintOpen=true;renderHints();updStats();persist();}});
  noteBtn.addEventListener('click',()=>setHelp(!helpOpen));
  again.addEventListener('click',()=>{rec.state=newMemory(lvl);rec.played++;persist();renderAll();});
  if(m.done)msg.replaceChildren(el('div',{class:'msg ok'},`Runde beendet: ${m.attempts} Versuche. Mit „Neu mischen“ startet eine neue Runde.`));
  renderHints();draw();
}

/* =====================================================================
   9 Spiel S02 – Der Bruch-Tresor
   Der Code ist ein Bruch. Jedes Schloss (Erweitern oder Kürzen) gibt eine Ziffer frei.
   Sind alle Schlösser offen, steht der Code-Bruch da – der Tresor nimmt aber nur den
   gekürzten Bruch. Wer ihn knackt, findet einen Bauplan für die Sammlung.
   ===================================================================== */
const VAULT_GROUPS={
  1:[['G02','U02'],['G03','G04','T01'],['U01','B01','G05']],
  2:[['G02','G05'],['G03','G04'],['U01','U02','T01'],['U03','B01','O01','O02']]
};
const LOOT=['Zahnradwagen','Dampfschiff','Windmühle','Leuchtturm','Hängebrücke','Segelflieger','Uhrwerk','Hebekran','Schleusentor','Wasserrad','Fernrohr','Seilbahn'];
const lootOf=()=>S.loot||(S.loot=[]);
/* Bevorzugt einen Bauplan, den es in der Sammlung noch nicht gibt */
function pickLoot(){
  const have=lootOf(),rest=LOOT.filter(x=>!have.includes(x));
  return RNG.pick(rest.length?rest:LOOT);
}
function newVault(level){
  const c=vaultCode(level,RNG);
  const types=RNG.shuffle(VAULT_GROUPS[level].map(g=>RNG.pick(g)));
  return {
    ver:2,level,digits:(String(c.a)+String(c.b)).split('').map(Number),numLen:String(c.a).length,
    locks:types.map(t=>newState(generateUnique(t,level))),
    door:newState({type:'V01',level,mode:'full',a:c.a,b:c.b,p:c.p,q:c.q,avoid:[]}),
    active:0,opened:false,loot:pickLoot()
  };
}
const vaultOk=(v,lvl)=>!!v&&v.ver===2&&v.level===lvl&&Array.isArray(v.locks)&&v.locks.length===v.digits.length&&!!v.door;
function renderVault(id){
  const lvl=levelOf(id),key=keyOf(id,lvl),rec=gameRec(key);
  if(!vaultOk(rec.state,lvl)){rec.state=newVault(lvl);rec.played++;persist();}
  const v=rec.state,n=v.locks.length;
  const solved=(l)=>l.status==='correct';
  const allSolved=()=>v.locks.every(solved);
  if(v.active<0||v.active>n||(v.active===n&&!allSolved()&&!v.opened))v.active=Math.max(0,v.locks.findIndex(l=>!solved(l)));
  const onDoor=()=>v.active>=n;
  const cur=()=>onDoor()?v.door:v.locks[v.active];
  let fresh=-1,ctrl=null;

  const root=el('div',{class:'page'});root.append(topbar(GAMES[id].name));
  const shell=el('div',{class:'shell'});const help=helpPanel();const main=el('main',{class:'work'});
  shell.append(main,help.el);root.append(shell);app.append(root);
  const fillStats=()=>help.setStats(el('div',null,el('h3',null,'Deine Runden'),el('table',{class:'stats'},
    el('tr',null,el('td',null,'Gespielte Runden'),el('td',null,el('b',null,String(rec.played)))),
    el('tr',null,el('td',null,'Geknackte Tresore'),el('td',null,el('b',null,String(rec.won)))),
    el('tr',null,el('td',null,'Baupläne gesammelt'),el('td',null,el('b',null,lootOf().length+' von '+LOOT.length)))),
    lootOf().length?el('p',{class:'lootlist'},lootOf().join(' · ')):null));
  fillStats();
  main.append(el('div',{class:'progress'},el('span',{class:'lvlbadge'},'Niveau '+LEVEL_LABEL[lvl])));
  const top=el('div',{class:'card vaultcard'});
  const puzzle=el('div',{class:'card vaultpuzzle'});
  const live=el('div',{class:'sr','aria-live':'polite'});
  main.append(top,puzzle,live);

  const hintBtn=el('button',{type:'button',class:'btn'},el('span',{class:'emo'},icon('hinweis')),'Tipp');
  const noteBtn=el('button',{type:'button',class:'btn'},el('span',{class:'emo'},icon('heft')),'Merkkasten');
  const primary=el('button',{type:'button',class:'btn primary'},'Prüfen');
  const solBtn=el('button',{type:'button',class:'linkbtn'},icon('auge'),'Lösung ansehen');
  const links=el('div',{class:'linkrow hidden'},solBtn);
  main.append(links);
  const host=el('div');
  const pad=makeKeypad(host,()=>onPrimary());
  const msg=el('div',{class:'dockmsg'});
  buildDock(main,{hintBtn,noteBtn,primary,pad,msg});

  /* Code-Anzeige: der Code-Bruch mit einem Feld je Ziffer */
  const range=(a,b)=>Array.from({length:b-a},(_,k)=>a+k);
  const codeFrac=()=>{
    const slot=(i)=>{
      const open=solved(v.locks[i]);
      return el('b',{class:'cf-slot'+(open?' on':'')+(i===fresh?' in':'')+(!open&&!v.opened&&!onDoor()&&i===v.active?' cur':''),'aria-hidden':'true'},open?String(v.digits[i]):'?');
    };
    const say=(a,b)=>range(a,b).map(i=>solved(v.locks[i])?String(v.digits[i]):'fehlt').join(' ');
    return el('div',{class:'codefrac',role:'img','aria-label':'Code-Bruch. Zähler: '+say(0,v.numLen)+'. Nenner: '+say(v.numLen,v.digits.length)+'.'},
      el('span',{class:'cf-row'},...range(0,v.numLen).map(slot)),el('span',{class:'cf-bar'}),el('span',{class:'cf-row'},...range(v.numLen,v.digits.length).map(slot)));
  };
  const lockChips=()=>{
    const box=el('div',{class:'locks',role:'group','aria-label':'Schlösser und Tür'});
    v.locks.forEach((l,i)=>{
      const open=solved(l);
      const b=el('button',{type:'button',class:'lock'+(open?' open':''),'aria-current':String(!v.opened&&i===v.active),'aria-label':`Schloss ${i+1}, ${open?'offen, Ziffer '+v.digits[i]:'verschlossen'}`},
        el('span',{class:'lk-n'},String(i+1)),icon(open?'haken':'schloss'));
      b.addEventListener('click',()=>{v.active=i;fresh=-1;persist();drawPuzzle(true);});
      box.append(b);
    });
    const ready=allSolved(),doorState=v.opened?'offen':(ready?'bereit':'gesperrt, erst alle Schlösser öffnen');
    const d=el('button',{type:'button',class:'lock door'+(v.opened?' open':'')+(ready?'':' locked'),'aria-current':String(!v.opened&&onDoor()),'aria-disabled':String(!ready),'aria-label':'Tresortür, '+doorState},
      icon(v.opened?'haken':'tresor'),el('span',{class:'lk-n'},'Tür'));
    d.addEventListener('click',()=>{if(!ready||v.opened)return;v.active=n;fresh=-1;persist();drawPuzzle(true);});
    box.append(d);
    return box;
  };
  const drawTop=()=>{
    const open=v.locks.filter(solved).length;
    const text=v.opened?`Der Tresor ist offen! Du hast den Bauplan »${v.loot}« gefunden.`
      :allSolved()?'Alle Schlösser sind offen. Jetzt steht der ganze Code-Bruch da.'
      :`Im Tresor liegt der Bauplan »${v.loot}«. Der Code ist ein Bruch – jedes Schloss verrät dir eine Ziffer.`;
    top.replaceChildren(
      el('div',{class:'vhead'},el('span',{class:'lblm'},'Code-Bruch'),
        v.opened?el('span',{class:'stampbox'},'Geknackt'):el('span',{class:'lblm vcount'},`${open} von ${n} offen`)),
      el('p',null,text),
      el('div',{class:'vpanel'},codeFrac(),el('div',{class:'vside'},lockChips(),
        v.opened?el('small',null,'Deine Sammlung: '+lootOf().length+' von '+LOOT.length+' Baupläne'):null)));
    fresh=-1;
  };

  const refresh=()=>{
    if(v.opened){primary.disabled=false;primary.textContent='Neue Runde';hintBtn.disabled=true;links.classList.add('hidden');pad.refresh();return;}
    const l=cur(),open=l.status==='open';
    primary.disabled=false;
    primary.textContent=open?'Prüfen':(l.status==='correct'?(allSolved()?'Zur Tür':'Nächstes Schloss'):(onDoor()?'Nochmal versuchen':'Neues Rätsel'));
    links.classList.toggle('hidden',!(open&&(l.attempts>0||l.hint>0)));
    const all=ctrl?ctrl.hintCount():0;
    hintBtn.disabled=!open||l.hint>=all;
    setHintLabel(hintBtn,l.hint>=all&&open?'Alle Tipps':(l.hint?`Tipp ${l.hint+1}`:'Tipp'));
    pad.refresh();
  };
  const openVault=()=>{
    v.opened=true;rec.won++;
    const have=lootOf();if(!have.includes(v.loot))have.push(v.loot);
    live.textContent='Der Tresor ist offen. Bauplan '+v.loot+' gefunden.';
    persist();fillStats();drawPuzzle();toTop();
    award(40,'Tresor geknackt!'); /* erst nach dem Umbau, damit die Einblendung über dem endgültigen Bedienpult liegt */
  };
  /* Erster Tipp: allgemeiner Hinweis; bei Kürzen-Aufgaben (und an der Tür) nennt er auch die 2-Regel */
  const prefixFor=()=>{
    if(onDoor())return [[HINT.vault[1],RULE2]];
    const l=cur(),own=TASKS[l.task.type].hints(l.task);
    return [own.length&&own.every(h=>h.some(x=>/2 geht IMMER/i.test(x)))?[HINT.vault[0],RULE2]:[HINT.vault[0]]];
  };
  const cbFor=()=>({
    save:()=>persist(),
    msgHost:msg,
    prefixHints:prefixFor(),
    afterCheck:()=>refresh(),
    done(kind){
      persist();
      if(kind==='correct'){
        if(onDoor()){openVault();return;}
        fresh=v.active;live.textContent='Schloss '+(v.active+1)+' ist offen. Ziffer '+v.digits[v.active]+' im Code.';drawTop();
        ctrl=mountTask(host,cur(),cbFor());refresh();toTop();
        return;
      }
      ctrl=mountTask(host,cur(),cbFor());refresh();
    }
  });
  /* Bereich sichtbar machen: auf kleinen Displays liegen Aufgabe und Code-Anzeige sonst unter Kopfzeile oder Bedienpult */
  const showEl=(node)=>{
    const bar=document.querySelector('.actionbar'),tb=document.querySelector('.topbar');
    const barTop=bar?bar.getBoundingClientRect().top:innerHeight,topEdge=tb?tb.getBoundingClientRect().bottom:0;
    const r=node.getBoundingClientRect();
    let dy=r.bottom>barTop-8?r.bottom-(barTop-8):0;
    if(r.top-dy<topEdge+8)dy=r.top-(topEdge+8);
    if(Math.abs(dy)>2)window.scrollBy({top:dy,behavior:'smooth'});
  };
  const reveal=()=>showEl(puzzle);
  const toTop=()=>showEl(top.querySelector('.vpanel')||top);
  const drawPuzzle=(show)=>{
    puzzle.replaceChildren();
    if(v.opened){host.replaceChildren();puzzle.classList.add('hidden');drawTop();refresh();return;}
    puzzle.classList.remove('hidden');
    const l=cur();
    puzzle.append(el('h3',null,onDoor()?'Tresortür – Code-Bruch kürzen':`Schloss ${v.active+1} – ${TASKS[l.task.type].name}`),host);
    help.setNotes(noteFor(l.task.type,l.task));
    ctrl=mountTask(host,l,cbFor());
    drawTop();refresh();
    if(show)reveal();
  };
  const newRound=()=>{rec.state=newVault(lvl);rec.played++;persist();renderAll();window.scrollTo(0,0);};
  const onPrimary=()=>{
    if(v.opened){newRound();return;}
    const l=cur();
    if(l.status==='open'){ctrl.check();refresh();return;}
    if(l.status==='shown'){ /* Lösung gesehen: neuer Versuch (Schloss: anderes Rätsel, Tür: derselbe Code-Bruch) */
      if(onDoor())v.door=newState(v.door.task);
      else v.locks[v.active]=newState(generateUnique(l.task.type,lvl));
      persist();drawPuzzle();return;
    }
    const nxt=v.locks.findIndex((x,i)=>!solved(x)&&i!==v.active);
    v.active=nxt>=0?nxt:n;
    persist();drawPuzzle(true);
  };
  primary.addEventListener('click',onPrimary);
  hintBtn.addEventListener('click',()=>{ctrl.hint();refresh();});
  noteBtn.addEventListener('click',()=>setHelp(!helpOpen));
  solBtn.addEventListener('click',()=>{ctrl.solution();refresh();});
  main.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='radio'&&host.contains(e.target)){e.preventDefault();onPrimary();}
  });
  drawPuzzle();
}

/* =====================================================================
   11 Selbsttest (Entwicklerkonsole: runSelfTests())
   ===================================================================== */
function runSelfTests(){
  const res=[],t=(name,ok)=>res.push({name,ok:!!ok});
  t('2/3 = 4/6',equivalent(2,3,4,6));
  t('12/18 = 2/3',equivalent(12,18,2,3));
  t('4/6 ≠ 8/6',!equivalent(4,6,8,6));
  const g02={type:'G02',level:1,mode:'factor',a:2,b:5,k:3};
  t('Erweitere 2/5 mit 3 → 6/15',validateTask(g02,{'r.n':'6','r.d':'15'}).correct);
  t('… nicht 4/10',!validateTask(g02,{'r.n':'4','r.d':'10'}).correct);
  const g03={type:'G03',level:1,mode:'factor',a:8,b:12,k:2};
  t('Kürze 8/12 mit 2 → 4/6',validateTask(g03,{'r.n':'4','r.d':'6'}).correct);
  t('8/12 ist nicht vollständig gekürzt',!isFullyReduced(8,12));
  const g03f={type:'G03',level:2,mode:'full',a:84,b:126,p:2,q:3};
  t('84/126 → 2/3',validateTask(g03f,{'r.n':'2','r.d':'3'}).correct);
  t('84/126 → 42/63 noch kürzbar',validateTask(g03f,{'r.n':'42','r.d':'63'}).errorCode==='notFull');
  const u01={type:'U01',level:1,terms:[{n:2,d:3,blank:null},{n:8,d:12,blank:'n'}]};
  t('2/3 = □/12 → 8',validateTask(u01,{g1:'8'}).correct&&!validateTask(u01,{g1:'9'}).correct);
  t('7/1000 → 0,007',fractionToDecimalString(7,1000)==='0,007');
  t('125/100 → 1,25',fractionToDecimalString(125,100)==='1,25');
  const d02=(s,den)=>{const p=parseGermanDecimal(s);return {type:'D02',level:1,n:p.num,den:Math.pow(10,p.places),places:p.places,s};};
  t('0,04 → 4/100',validateTask(d02('0,04'),{'r.n':'4','r.d':'100'}).correct&&!validateTask(d02('0,04'),{'r.n':'4','r.d':'10'}).correct);
  t('0,050 → 50/1000',validateTask(d02('0,050'),{'r.n':'50','r.d':'1000'}).correct&&!validateTask(d02('0,050'),{'r.n':'5','r.d':'100'}).correct);
  t('1,25 → 125/100',validateTask(d02('1,25'),{'r.n':'125','r.d':'100'}).correct);

  t('Schnellcheck: 15 Fragen, Hürde 12 von 15, Texte nennen diese Zahlen',TASKS.Q00.size===15&&needOf(15)===12&&PATH.find(m=>m.id==='Q00').desc.includes('15 Fragen')&&PATH.find(m=>m.id==='Q00').desc.includes('Ab 12')&&TASKS.Q00.desc.includes('15'));
  t('Auswertung: 0 und 4 von 15 = von vorn (nichts „sitzt“), 4 mit Fortschritt = Plan',qev(qres(qplan.map((_,i)=>i))).stufe==='start'&&qev(qres(qplan.map((_,i)=>i).filter(i=>i>=4))).stufe==='start'&&Q_SKILLS.every(sk=>qev(qres(qplan.map((_,i)=>i).filter(i=>i>=4))).skills[sk].status==='ueben')&&qev(qres(qplan.map((_,i)=>i).filter(i=>i>=4)),true).stufe==='plan');
  t('Auswertung: 5 und 11 = Themenliste, 12 und 15 = fit',qev(qres(qplan.map((_,i)=>i).filter(i=>i>=5))).stufe==='plan'&&qev(qres(qplan.map((_,i)=>i).filter(i=>i>=11))).stufe==='plan'&&qev(qres(qplan.map((_,i)=>i).filter(i=>i>=12))).stufe==='fit'&&qev(qres([])).stufe==='fit');
  const mix=qev(qres([].concat(pos('teilbar').slice(0,1),pos('erweitern').slice(0,2),pos('kuerzen'))));
  t('Auswertung je Fähigkeit: 3/3 sitzt, 2/3 fast, 1/3 und 0/3 üben',mix.skills.gleich.status==='sitzt'&&mix.skills.teilbar.status==='fast'&&mix.skills.erweitern.status==='ueben'&&mix.skills.kuerzen.status==='ueben'&&mix.skills.vollstaendig.status==='sitzt');
  const oldPlan=['gleich','gleich','teilbar','teilbar','erweitern','erweitern','kuerzen','kuerzen','vollstaendig','vollstaendig'];
  const oldEv=qEvaluate(['f','f','x','f','f','f','f','x','f','f'],oldPlan,10,false);
  t('Auswertung: Runden mit 2 Fragen je Fähigkeit (Altdaten) funktionieren (2 von 2 = sitzt)',oldEv.skills.gleich.status==='sitzt'&&oldEv.skills.teilbar.status==='ueben'&&oldEv.skills.erweitern.status==='sitzt'&&oldEv.stufe==='fit');
  /* Rundenende: Platzierung, Plan, Urkunde */
  const badIx=[1,3,8]; /* teilbar 2/3, kuerzen 1/3, Rest 3/3 → 12 richtig */
  freshP();
  inf=onRoundEnd('Q00',1,rnd(qres(badIx),qplan));
  t('Einstufung: nur 3 von 3 ist per Check frei (G01, G02, G04), „fast“ und „üben“ nicht',S.checked.G01&&S.checked.G02&&S.checked.G04&&!S.checked.T01&&!S.checked.G03&&!S.checked.G05&&S.placed&&!inf.final&&inf.ev.stufe==='fit');
  const pl1=planOf();
  t('Plan: Bauteile in Pfadreihenfolge, die nicht sitzen, dazu G05; „jetzt“ ist das erste (fast)',!!pl1&&pl1.items.map(x=>x.id).join()==='T01,G03,G05'&&pl1.now.id==='T01'&&pl1.now.status==='fast'&&pl1.items[1].status==='ueben');
  t('Plan: Karte mit Kurztest-Knopf bei „fast“, Marke Empfohlen nur bei offenen Plan-Bauteilen',(()=>{const c=planCard(pl1);return c.querySelectorAll('li.plan-it').length===3&&c.querySelectorAll('li.now .pl-act button').length===2&&/Kurztest/.test(c.textContent);})());
  S.passed['T01-L1']=true;
  const pl2=planOf();
  t('Plan: erledigtes Bauteil rückt vor, „jetzt“ wechselt',pl2.now.id==='G03'&&pl2.items[0].done);
  S.passed['G03-L1']=true;S.passed['G05-L1']=true;
  t('Plan: alles erledigt ⇒ Karte verschwindet',planOf()===null);
  freshP();
  inf=onRoundEnd('Q00',1,rnd(qres([]),qplan));
  t('Einstufung: 15 von 15 schaltet alles frei, Urkunde, kein Plan',['G01','G02','T01','G03','G04','G05'].every(x=>S.checked[x])&&inf.final&&S.final&&planOf()===null);
  freshP();
  inf=onRoundEnd('Q00',1,rnd(qres(qplan.map((_,i)=>i).filter(i=>i>=4)),qplan));
  t('Von vorn: höchstens 4 richtig ohne Fortschritt – nichts freigeschaltet, Plan = Bruchlabor + Gleiche Anteile',inf.ev.stufe==='start'&&Object.keys(S.checked).length===0&&S.placed&&!S.final&&(()=>{const p=planOf();return !!p&&p.items.map(x=>x.id).join()==='LAB,G01'&&p.now.id==='LAB'&&p.stufe==='start';})());
  S.lab={done:true};
  t('Von vorn: nach dem Labor ist Gleiche Anteile dran, danach verschwindet der Plan',planOf().now.id==='G01'&&(()=>{S.passed['G01-L1']=true;return planOf()===null;})());
  freshP();S.passed['G01-L1']=true;
  inf=onRoundEnd('Q00',1,rnd(qres(qplan.map((_,i)=>i).filter(i=>i>=4)),qplan));
  t('Wenige Treffer mitten im Pfad: kein „von vorn“, nichts frei, Plan mit allem „üben“',inf.ev.stufe==='plan'&&Object.keys(S.checked).length===0&&S.einstufung.stufe==='plan'&&S.einstufung.skills.erweitern.status==='ueben');
  S.einstufung={at:1,right:13,size:15,stufe:'fit',skills:S.einstufung.skills};
  inf=onRoundEnd('Q00',1,rnd(qres(qplan.map((_,i)=>i).filter(i=>i>=4)),qplan));
  t('Wenige Treffer überschreiben einen vorhandenen Plan nicht',S.einstufung.at===1&&S.einstufung.stufe==='fit');
  freshP();
  inf=onRoundEnd('Q00',1,rnd(qres(pos('vollstaendig')),qplan));
  t('3+3+3+3+0 ist „fit“, aber nicht fertig: keine Urkunde, Plan = G04 und G05',inf.ev.stufe==='fit'&&!inf.final&&!S.final&&planOf().items.map(x=>x.id).join()==='G04,G05'&&S.checked.G03&&!S.checked.G04);
  freshP();['G01','G02','T01','G03','G04','G05'].forEach(x=>{S.passed[x+'-L1']=true;});
  inf=onRoundEnd('Q00',1,rnd(qres(qplan.map((_,i)=>i).filter(i=>i>=11)),qplan));
  t('Abschlusscheck: alles fertig, aber nur 11 von 15 ⇒ keine Urkunde (ready, nicht passed)',inf.ready&&!inf.passed&&!inf.final&&!S.final);
  inf=onRoundEnd('Q00',1,rnd(qres(qplan.map((_,i)=>i).filter(i=>i>=12)),qplan));
  t('Abschlusscheck: alles fertig und 12 von 15 ⇒ Urkunde',inf.ready&&inf.passed&&inf.final&&S.final);
  freshP();S.passed['G01-L1']=true;
  inf=onRoundEnd('Q00',1,rnd(['f','f','f','f','f','f','x','x','f','f'],oldPlan));
  t('Abschluss: ohne alle Pflicht-Bauteile keine Urkunde',inf.passed&&!inf.final&&!S.final);
  t('Migration 6: alte Schnellcheck-Runden (10 Fragen) werden verworfen, Rest bleibt',(()=>{const o={rounds:{'Q00-L1':{size:10,results:[]},'Q00-L2':{size:15,results:[]},'G02-L1':{size:5,results:[]},'Q01-L1':{size:5,results:[]}}};migrate6(o);return !o.rounds['Q00-L1']&&!!o.rounds['Q00-L2']&&!!o.rounds['G02-L1']&&!!o.rounds['Q01-L1'];})());
  freshP();S.quizFor='G02';
  inf=onRoundEnd('Q01',1,rnd(['f','f','f','x','f']));
  t('Kurztest: 4 von 5 ⇒ Bauteil per Check, kein Pfad-Eintrag Q01',inf.quiz.passed&&S.checked.G02&&!S.passed['Q01-L1']);
  freshP();S.quizFor='G02';
  inf=onRoundEnd('Q01',1,rnd(['f','x','f','x','f']));
  t('Kurztest: 3 von 5 ⇒ nicht frei',!inf.quiz.passed&&!S.checked.G02);
  freshP();
  const dk=(off)=>{const d=new Date();d.setDate(d.getDate()+off);return dayKey(d);};
  S.days[dk(0)]=1;S.days[dk(-1)]=2;S.days[dk(-2)]=1;
  t('Tage-Serie: 3 Tage in Folge',dayStreak()===3);
  delete S.days[dk(0)];
  t('Tage-Serie: heute noch nichts ⇒ ab gestern gezählt',dayStreak()===2);
  S.days={};S.days[dk(-3)]=1;
  t('Tage-Serie: Lücke ⇒ 0',dayStreak()===0);
  const old={progress:{'G03-L1':{first:5},'G02-L2':{first:3},'D01-L1':{first:9},'G01-L1':{first:4}}};
  migrate4(old);
  t('Migration: mind. 4 Treffer ⇒ bestanden; Rest und Nicht-Pfad-Übungen nicht',old.passed['G03-L1']&&old.passed['G01-L1']&&!old.passed['G02-L2']&&!old.passed['D01-L1']&&!!old.checked&&!!old.days);
  /* Bruch-Tresor: Code-Bruch, Schlösser, Tür */
  {
    let okCode=true,okSlots=true,okTypes=true,okDoor=true,okRange=true;
    const allowed=new Set([].concat(...Object.values(VAULT_GROUPS).map(gs=>[].concat(...gs))));
    for(const lvl of [1,2])for(let i=0;i<300;i++){
      const v=newVault(lvl),c=v.door.task;
      okCode=okCode&&c.a===c.p*(c.a/c.p)&&c.a%c.p===0&&c.b/c.q===c.a/c.p&&gcd(c.p,c.q)===1&&c.a/c.p>=2&&c.p<c.q;
      okSlots=okSlots&&v.digits.length===v.locks.length&&v.digits.join('')===String(c.a)+String(c.b)&&v.numLen===String(c.a).length&&v.locks.length===(lvl===1?3:4);
      okTypes=okTypes&&v.locks.every(l=>allowed.has(l.task.type)&&!/^D0/.test(l.task.type))&&new Set(v.locks.map(l=>l.task.type)).size===v.locks.length;
      okRange=okRange&&(lvl===1?(c.a<=9&&c.b>=10&&c.b<=60):(c.a>=10&&c.b<=99&&c.b>c.a&&(c.a/c.p)%10!==0&&(c.a/c.p)>=6));
      const g=c.a/c.p,k=smallestPrimeFactor(g),part=validateTask(c,{'r.n':String(c.a/k),'r.d':String(c.b/k)});
      okDoor=okDoor&&validateTask(c,{'r.n':String(c.p),'r.d':String(c.q)}).correct
        &&!validateTask(c,{'r.n':String(c.a),'r.d':String(c.b)}).correct
        &&(k===g?part.correct:(!part.correct&&part.soft&&part.errorCode==='notFull')); /* Teilschritt: bei zusammengesetztem Teiler nur „fast“ */
    }
    t('Tresor: Code-Bruch a/b = p/q erweitert, p/q gekürzt, Teiler ≥ 2',okCode);
    t('Tresor: ein Schloss je Ziffer (leicht 3, knifflig 4), Ziffern = Zähler + Nenner',okSlots);
    t('Tresor: nur Erweitern/Kürzen-Schlösser, jede Art höchstens einmal',okTypes);
    t('Tresor: Zahlenbereich leicht a ≤ 9, b ≤ 60; knifflig zweistellig, Teiler ab 6 (nicht 10, 20)',okRange);
    t('Tresor: Tür akzeptiert nur den gekürzten Code-Bruch',okDoor);
    const dv=newVault(2).door.task,h=TASKS.V01.hints(dv);
    t('Tresor: Tür-Tipps nennen „Die 2 geht IMMER“',h.every(x=>x.some(l=>/2 geht IMMER/i.test(l))));
    const half=validateTask({type:'V01',level:2,mode:'full',a:48,b:72,p:2,q:3},{'r.n':'24','r.d':'36'});
    t('Tresor: Tür 48/72 → 24/36 ist „fast“ (noch kürzbar)',!half.correct&&half.soft&&half.errorCode==='notFull');
    t('Tresor: alte Tresor-Zustände ohne ver:2 werden verworfen',!vaultOk({level:1,code:[1,2,3],locks:[{},{},{}],active:0,opened:false},1)&&vaultOk(newVault(1),1)&&!vaultOk(newVault(1),2));
  }
  /* Hilfe bei Problemen: vollständig, kurze Sätze für Kinder von 11–12 Jahren, öffnet sich mit Thema */
  {
    const words=(s)=>s.split(/\s+/).filter(Boolean).length;
    const texts=[];
    PROBLEMS.forEach(p=>{texts.push(p.q);if(p.intro)texts.push(p.intro);p.steps.forEach(s=>texts.push(s));if(p.tip)texts.push(p.tip);});
    const longest=Math.max(...[].concat(...texts.map(x=>x.replace(/\*\*/g,'').split(/[.!?]\s+/))).map(words));
    t('Hilfe: jedes Thema hat Frage, 1–4 Schritte und eine eindeutige Kennung',PROBLEMS.length>=6&&PROBLEMS.every(p=>p.id&&p.q&&p.steps.length>=1&&p.steps.length<=4)&&new Set(PROBLEMS.map(p=>p.id)).size===PROBLEMS.length);
    t('Hilfe: kurze Sätze, höchstens 14 Wörter (längster: '+longest+')',longest<=14);
    t('Hilfe: alle Knöpfe und Zusatzzeilen der Themen gibt es',PROBLEMS.every(p=>(p.acts||[]).every(k=>!!HELP_ACTS[k])&&(!p.extra||typeof p.extra==='function')));
    openProblemHelp('speichern');
    const hm=document.querySelector('.techmodal');
    const open1=hm?hm.querySelectorAll('details.tech[open]'):[];
    t('Hilfe: öffnet sich mit dem gewünschten Thema, genau ein Eintrag offen',!!hm&&hm.querySelectorAll('details.tech').length===PROBLEMS.length&&open1.length===1&&open1[0].dataset.id==='speichern');
    closeProblemHelp();
    t('Hilfe: Schließen entfernt die Anleitung',!document.querySelector('.techmodal')&&techModal===null);
  }
  Object.assign(S,keepP);persist();
  const bad=res.filter(r=>!r.ok);
  console.log(`Selbsttest: ${res.length-bad.length}/${res.length} bestanden`);
  bad.forEach(b=>console.error('FEHLER:',b.name));
  return {total:res.length,failed:bad.map(b=>b.name),passed:res.length-bad.length};
}
window.runSelfTests=runSelfTests;

/* ---------- Start ---------- */
(function boot(){
  try{localStorage.setItem(KEY+'_probe','1');localStorage.removeItem(KEY+'_probe');}catch(e){Store.ok=false;}
  if((S.schema||1)<3){S.rounds={};Object.keys(S.games||{}).forEach(k=>{S.games[k].state=null;});S.schema=3;persist();}
  if((S.schema||1)<4){migrate4(S);S.view={kind:'home',tab:'pfad'};S.schema=4;persist();}
  if((S.schema||1)<5){Object.keys(S.games||{}).forEach(k=>{if(k.indexOf('S02')===0)S.games[k].state=null;});S.schema=5;persist();}
  if((S.schema||1)<6){migrate6(S);S.schema=6;persist();}
  if(!S.perfect)S.perfect={};
  if(!S.ui)S.ui={size:'m'};
  applyUi();
  if(S.rankSeen==null){S.rankSeen=rankState().i;persist();}
  if(!S.view||(S.view.kind==='home'&&S.view.tab==='aufgaben'))S.view={kind:'home',tab:'ueben',group:S.view&&S.view.group};
  try{history.replaceState({v:S.view},'');}catch(e){}
  renderAll();
})();
</script>
