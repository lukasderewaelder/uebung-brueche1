/* mountTask: baut Aufgabe, Rückmeldung, Tipps und (auf Wunsch) Lösung in host auf */
function mountTask(host,st,cb){
  const T=TASKS[st.task.type];
  const view={task:st.task,draft:st.draft,inputs:{},st,save:()=>cb.save(),locked:()=>st.status!=='open'};
  const allHints=()=>(cb.prefixHints||[]).concat(T.hints(st.task));
  host.replaceChildren();
  const prompt=el('div',{class:'prompt'});T.prompt(st.task,prompt);
  const stage=el('div',{class:'stage'});T.render(view,stage);
  const fb=el('div',{class:'feedback','aria-live':'polite'});
  const hints=el('div',{class:'hints'});
  const sol=el('div',{class:'solution'});
  host.append(prompt,stage,sol);
  if(cb.msgHost)cb.msgHost.replaceChildren(fb,hints);else host.append(fb,hints);
  const showFb=(kind,text)=>{st.fb={kind,text};fb.replaceChildren(el('div',{class:'msg '+kind},text));};
  const renderHints=()=>{
    hints.replaceChildren();
    const hs=allHints(),i=Math.min(st.hint,hs.length)-1;
    if(i>=0)hints.append(el('div',{class:'hint'},el('b',{class:'lab'},icon('hinweis'),`Tipp ${i+1} von ${hs.length}`),hs[i].map(x=>el('p',null,x))));
  };
  const showSolution=()=>{sol.replaceChildren(el('div',{class:'solbox'},el('h4',null,icon('auge'),'Musterlösung'),...buildWorkedSolution(st.task)));setTimeout(()=>sol.scrollIntoView({block:'nearest',behavior:'smooth'}),50);};
  const applyMarks=(marks)=>{
    for(const k in view.inputs){const i=view.inputs[k];if(i&&i.classList)i.classList.remove('bad','good');}
    for(const k in marks){const i=view.inputs[k];if(i&&i.classList)i.classList.add(marks[k]?'good':'bad');}
  };
  if(st.fb)showFb(st.fb.kind,st.fb.text);
  renderHints();
  if(st.status==='shown')showSolution();
  const api={
    view,
    hintCount:()=>allHints().length,
    check(){
      const r=this.doCheck();if(cb.afterCheck)cb.afterCheck();return r;
    },
    doCheck(){
      if(st.status!=='open')return null;
      const res=validateTask(st.task,st.draft);
      if(res.invalid){showFb('bad',res.feedback);return 'invalid';}
      if(res.correct){st.status='correct';showFb('ok',praise()+' '+res.feedback.replace(/^Richtig!\s*/,''));awardCorrect(st.attempts===0&&st.hint===0);cb.done('correct');return 'correct';}
      st.attempts++;breakStreak();showFb('bad',res.feedback);applyMarks(res.marks||{});cb.save();
      try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}
      host.classList.remove('shake');void host.offsetWidth;host.classList.add('shake');return 'wrong';
    },
    hint(){
      if(st.hint<allHints().length){st.hint++;cb.save();renderHints();}
      return st.hint>=allHints().length;
    },
    solution(){
      if(st.status!=='open')return;
      st.status='shown';st.fb=null;fb.replaceChildren(el('div',{class:'msg info'},'Schau dir die Lösung genau an. Dann geht es weiter.'));showSolution();cb.done('shown');
    }
  };
  view.submit=()=>api.check();
  return api;
}

/* =====================================================================
   8 Spiel S01 – Bruch-Memory
   ===================================================================== */
function memoryFace(n,d,mode){return {n,d,mode};}
function genMemoryPairs(level,count,R){
  const used=new Set(),pairs=[],maxQ=level===1?8:12;
  const sameFace=(a,b)=>a.mode===b.mode&&a.n===b.n&&a.d===b.d;
  let guard=0;
  while(pairs.length<count&&guard++<2000){
    const q=R.int(2,maxQ),p=R.int(1,q-1);
    if(gcd(p,q)!==1||used.has(p+'/'+q))continue;
    let a,b;
    if(level===1){
      const kind=R.pick(['pic','pic','num']);
      if(kind==='num'){const k=R.int(2,5);a=memoryFace(p,q,'num');b=memoryFace(p*k,q*k,'num');}
      else{
        const k1=R.int(1,2),k2=R.pick([1,2,3,4].filter(x=>x!==k1));
        const m=pickMode(q*k1,R,24);if(!m)continue;
        a=memoryFace(p*k1,q*k1,m);b=memoryFace(p*k2,q*k2,'num');
      }
    }else{
      const kind=R.pick(['num','num','pic','picpic','red']);
      const ks=R.shuffle([1,2,3,4,5,6,7,8,9]);
      if(kind==='num'){a=memoryFace(p*ks[0],q*ks[0],'num');b=memoryFace(p*ks[1],q*ks[1],'num');}
      else if(kind==='red'){const k=R.int(4,9);a=memoryFace(p*k,q*k,'num');b=memoryFace(p,q,'num');}
      else if(kind==='pic'){
        const m=pickMode(q*ks[0],R,24);if(!m)continue;
        a=memoryFace(p*ks[0],q*ks[0],m);b=memoryFace(p*ks[1],q*ks[1],'num');
      }else{
        const m1=pickMode(q*ks[0],R,24),m2=pickMode(q*ks[1],R,24);if(!m1||!m2)continue;
        a=memoryFace(p*ks[0],q*ks[0],m1);b=memoryFace(p*ks[1],q*ks[1],m2);
      }
    }
    if(sameFace(a,b))continue;
    used.add(p+'/'+q);pairs.push(R.chance(0.5)?[a,b]:[b,a]);
  }
  return pairs;
}
function newMemory(level){
  const pairs=genMemoryPairs(level,level===1?6:10,RNG);
  const cards=[];
  pairs.forEach((pr,i)=>{cards.push({pair:i,face:pr[0],state:'down'});cards.push({pair:i,face:pr[1],state:'down'});});
  return {level,cards:RNG.shuffle(cards),first:null,attempts:0,hints:0,hintStage:0,done:false};
}

  const again=el('button',{type:'button',class:'btn primary'},'Neu mischen');
  main.append(el('div',{class:'actionbar'},el('div',{class:'primaryrow'},hintBtn,noteBtn,again)));
  const renderHints=()=>{hints.replaceChildren();HINT.memory.slice(0,m.hintStage).forEach((h,i)=>hints.append(el('div',{class:'hint'},el('b',{class:'lab'},'Tipp '+(i+1)),el('p',null,h))));hintBtn.disabled=m.hintStage>=HINT.memory.length;};
  const updStats=()=>{
    const found=m.cards.filter(c=>c.state==='matched').length/2;
    stats.replaceChildren(el('span',null,`Gefundene Paare: ${found} von ${m.cards.length/2}`),el('span',null,`Versuche: ${m.attempts}`),el('span',null,`Tipps: ${m.hints}`));
  };
  const faceNode=(c)=>c.face.mode==='num'?frac(c.face.n,c.face.d):drawMode(c.face.mode,c.face.n,c.face.d,{maxW:100,label:'Bruchbild'});
  const draw=()=>{
    grid.replaceChildren();
    m.cards.forEach((c,i)=>{
      const down=c.state==='down';
      const b=el('button',{type:'button',class:'mcard '+c.state,'aria-label':down?`Karte ${i+1}, verdeckt`:(c.face.mode==='num'?`Karte ${i+1}: ${c.face.n} durch ${c.face.d}`:`Karte ${i+1}: Bruchbild`)},down?'?':faceNode(c));
      b.addEventListener('click',()=>flip(i));
      grid.append(b);
    });
    updStats();
  };
  const flip=(i)=>{
    if(busy||m.done)return;
    const c=m.cards[i];if(c.state!=='down')return;
    c.state='up';
    if(m.first===null){m.first=i;draw();persist();return;}
    const f=m.cards[m.first];m.attempts++;
    if(f.pair===c.pair){
      f.state=c.state='matched';m.first=null;
      if(m.cards.every(x=>x.state==='matched')){
        m.done=true;rec.won++;rec.best=rec.best==null?m.attempts:Math.min(rec.best,m.attempts);
        award(30,'Memory geschafft!');msg.replaceChildren(el('div',{class:'msg ok'},`Geschafft! Du hast alle ${m.cards.length/2} Paare in ${m.attempts} Versuchen gefunden.`));fillStats();
      }
      draw();persist();
    }else{
      busy=true;draw();
      setTimeout(()=>{f.state='down';c.state='down';m.first=null;busy=false;if(document.getElementById('memhost')===grid)draw();persist();},1100);
    }
  };
  hintBtn.addEventListener('click',()=>{if(m.hintStage<HINT.memory.length){m.hintStage++;m.hints++;renderHints();updStats();persist();}});
  noteBtn.addEventListener('click',()=>setHelp(!helpOpen));
  again.addEventListener('click',()=>{rec.state=newMemory(lvl);rec.played++;persist();renderAll();});
  if(m.done)msg.replaceChildren(el('div',{class:'msg ok'},`Runde beendet: ${m.attempts} Versuche. Mit „Neu mischen“ startet eine neue Runde.`));
  renderHints();draw();
}

/* =====================================================================
   9 Spiel S02 – Der Bruch-Tresor
   ===================================================================== */
const VAULT_GROUPS={
  1:[['G02','G03','G04','G05'],['U01','U02','B01'],['D01','D02','D03']],
  2:[['G02','G03','G04','G05'],['U01','U02'],['U03','B01'],['O01','O02'],['D01','D02'],['D03']]
};
function newVault(level){
  const types=RNG.shuffle(VAULT_GROUPS[level].map(g=>RNG.pick(g)));
  return {level,code:types.map(()=>RNG.int(0,9)),locks:types.map(t=>newState(generateUnique(t,level))),active:0,opened:false,entry:''};
}
function renderVault(id){
  const lvl=levelOf(id),key=keyOf(id,lvl),rec=gameRec(key);
  if(!rec.state||rec.state.level!==lvl||!rec.state.locks){rec.state=newVault(lvl);rec.played++;persist();}
  const v=rec.state;
  const root=el('div');root.append(topbar(GAMES[id].name));
  const shell=el('div',{class:'shell'});const help=helpPanel();const main=el('main',{class:'work'});
  shell.append(main,help.el);root.append(shell);app.append(root);
  const fillStats=()=>help.setStats(el('div',null,el('h3',null,'Deine Runden'),el('table',{class:'stats'},
    el('tr',null,el('td',null,'Gespielte Runden'),el('td',null,el('b',null,String(rec.played)))),
    el('tr',null,el('td',null,'Geknackte Tresore'),el('td',null,el('b',null,String(rec.won)))))));
  fillStats();
  main.append(el('div',{class:'progress'},el('span',{class:'lvlbadge'},'Niveau '+LEVEL_LABEL[lvl])));
  const top=el('div',{class:'card'});
  const puzzle=el('div',{class:'card',style:'margin-top:14px'});
  const entryBox=el('div',{class:'card',style:'margin-top:14px'});
  main.append(top,puzzle,entryBox);

  const solved=(l)=>l.status==='correct';
  const allSolved=()=>v.locks.every(solved);
  const hintBtn=el('button',{type:'button',class:'btn'},el('span',{class:'emo'},icon('hinweis')),'Tipp');
  const noteBtn=el('button',{type:'button',class:'btn'},el('span',{class:'emo'},icon('heft')),'Merkkasten');
  const primary=el('button',{type:'button',class:'btn primary'},'Prüfen');
  const solBtn=el('button',{type:'button',class:'linkbtn'},icon('auge'),'Lösung ansehen');
  const links=el('div',{class:'linkrow hidden'},solBtn);
  main.append(links);
  let ctrl=null;
  const host=el('div');
  const pad=makeKeypad(host,()=>onPrimary());
  const msg=el('div',{class:'dockmsg'});
  buildDock(main,{hintBtn,noteBtn,primary,pad,msg});

  const drawTop=()=>{
    top.replaceChildren(el('p',null,v.opened?el('b',null,'Der Tresor ist geöffnet!'):`Löse die Rätsel an den Schlössern. Jedes geöffnete Schloss zeigt eine Ziffer des Codes. Geöffnet: ${v.locks.filter(solved).length} von ${v.locks.length}.`));
    const vault=el('div',{class:'vault',role:'group','aria-label':'Schlösser'});
    v.locks.forEach((l,i)=>{
      const open=solved(l);
      const b=el('button',{type:'button',class:'lock'+(open?' open':''),'aria-current':String(i===v.active&&!v.opened),'aria-label':`Schloss ${i+1}, ${open?'offen, Ziffer '+v.code[i]:'verschlossen'}`},
        el('span',{class:'st'},'Schloss '+(i+1)),el('span',{class:'dg'},open?String(v.code[i]):icon('schloss')),el('span',{class:'st'},open?'offen':'verschlossen'));
      b.addEventListener('click',()=>{v.active=i;persist();drawPuzzle();});
      vault.append(b);
    });
    top.append(vault);
  };
  let codeSubmit=null;
  const codePad=makeKeypad(entryBox,()=>codeSubmit&&codeSubmit());
  const drawEntry=()=>{
    entryBox.replaceChildren();
    if(!allSolved()){entryBox.classList.add('hidden');return;}
    entryBox.classList.remove('hidden');
    if(v.opened){
      entryBox.append(el('div',{class:'msg ok'},'Der Code stimmt – der Tresor ist offen! Gut gemacht.'),el('button',{type:'button',class:'btn primary',onclick:()=>{rec.state=newVault(lvl);rec.played++;persist();renderAll();}},'Neue Runde'));
      return;
    }
    entryBox.append(el('h3',null,'Gib den Code ein'),el('p',null,`Alle Schlösser sind offen. Der Code hat ${v.code.length} Ziffern – in der Reihenfolge der Schlösser.`));
    const row=el('div',{class:'codeline'});
    const inputs=v.code.map((_,i)=>{
      const inp=el('input',{type:'text',inputmode:'none',maxlength:'1','aria-label':'Ziffer '+(i+1),autocomplete:'off'});
      inp.value=v.entry[i]||'';
      inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'');const a=inputs.map(x=>x.value||' ').join('');v.entry=a;persist();if(inp.value&&inputs[i+1])inputs[i+1].focus();});
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryCode();}if(e.key==='Backspace'&&!inp.value&&inputs[i-1])inputs[i-1].focus();});
      row.append(inp);return inp;
    });
    const res=el('div',{'aria-live':'polite'});
    const tryCode=()=>{
      const guess=inputs.map(x=>x.value).join('');
      if(guess.length<v.code.length){res.replaceChildren(el('div',{class:'msg bad'},'Trage in jedes Feld eine Ziffer ein.'));return;}
      if(guess===v.code.join('')){v.opened=true;rec.won++;award(40,'Tresor geknackt!');persist();fillStats();drawTop();drawEntry();drawPuzzle();}
      else res.replaceChildren(el('div',{class:'msg bad'},'Der Code stimmt nicht. Schau dir die Ziffern an den Schlössern noch einmal an. Du kannst es erneut versuchen.'));
    };
    codeSubmit=tryCode;
    entryBox.append(row,res,codePad.el,el('button',{type:'button',class:'btn primary',onclick:tryCode},'Tresor öffnen'));
    codePad.refresh();
  };
  const refresh=()=>{
    const l=v.locks[v.active];
    if(v.opened){primary.disabled=true;hintBtn.disabled=true;solBtn.disabled=true;primary.textContent='Prüfen';links.classList.add('hidden');pad.refresh();return;}
    const open=l.status==='open';
    primary.disabled=false;
    primary.textContent=open?'Prüfen':(l.status==='correct'?(allSolved()?'Zum Code':'Nächstes Schloss'):'Neues Rätsel');
    links.classList.toggle('hidden',!(open&&(l.attempts>0||l.hint>0)));
    const all=ctrl?ctrl.hintCount():0;
    hintBtn.disabled=!open||l.hint>=all;
    setHintLabel(hintBtn,l.hint>=all&&open?'Alle Tipps':(l.hint?`Tipp ${l.hint+1}`:'Tipp'));
    pad.refresh();
  };
  const drawPuzzle=()=>{
    const l=v.locks[v.active];
    puzzle.replaceChildren();
    if(v.opened){puzzle.classList.add('hidden');refresh();drawTop();return;}
    puzzle.classList.remove('hidden');
    puzzle.append(el('h3',null,`Schloss ${v.active+1} – ${TASKS[l.task.type].name}`),host);
    help.setNotes(noteFor(l.task.type,l.task));
    ctrl=mountTask(host,l,{
      save:()=>persist(),
      prefixHints:[[HINT.vault[0]]],
      msgHost:msg,
      afterCheck:()=>refresh(),
      done(kind){
        persist();
        if(kind==='correct'){drawTop();drawEntry();}
        ctrl=mountTask(host,l,this);
        refresh();
      }
    });
    refresh();drawTop();
  };
  const onPrimary=()=>{
    if(v.opened)return;
    const l=v.locks[v.active];
    if(l.status==='open'){ctrl.check();refresh();return;}
    if(l.status==='shown'){ /* anderes Rätsel derselben Art */
      v.locks[v.active]=newState(generateUnique(l.task.type,lvl));persist();drawPuzzle();return;
    }
    const nxt=v.locks.findIndex((x,i)=>!solved(x)&&i!==v.active);
    if(nxt>=0){v.active=nxt;persist();drawPuzzle();}
    else{drawEntry();entryBox.scrollIntoView({block:'center'});const f=entryBox.querySelector('input');if(f)f.focus();}
  };
  primary.addEventListener('click',onPrimary);
  hintBtn.addEventListener('click',()=>{ctrl.hint();refresh();});
  noteBtn.addEventListener('click',()=>setHelp(!helpOpen));
  solBtn.addEventListener('click',()=>{ctrl.solution();refresh();});
  main.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='radio'&&host.contains(e.target)){e.preventDefault();onPrimary();}
  });
  drawTop();drawEntry();drawPuzzle();
}

/* =====================================================================
   11 Selbsttest (Entwicklerkonsole: runSelfTests())
   ===================================================================== */
function runSelfTests(){
  const res=[],t=(name,ok)=>res.push({name,ok:!!ok});
  t('2/3 = 4/6',equivalent(2,3,4,6));
  t('12/18 = 2/3',equivalent(12,18,2,3));
  t('4/6 ≠ 8/6',!equivalent(4,6,8,6));
  const g02={type:'G02',level:1,mode:'factor',a:2,b:5,k:3};
  t('Erweitere 2/5 mit 3 → 6/15',validateTask(g02,{'r.n':'6','r.d':'15'}).correct);
  t('… nicht 4/10',!validateTask(g02,{'r.n':'4','r.d':'10'}).correct);
  const g03={type:'G03',level:1,mode:'factor',a:8,b:12,k:2};
  t('Kürze 8/12 mit 2 → 4/6',validateTask(g03,{'r.n':'4','r.d':'6'}).correct);
  t('8/12 ist nicht vollständig gekürzt',!isFullyReduced(8,12));
  const g03f={type:'G03',level:2,mode:'full',a:84,b:126,p:2,q:3};
  t('84/126 → 2/3',validateTask(g03f,{'r.n':'2','r.d':'3'}).correct);
  t('84/126 → 42/63 noch kürzbar',validateTask(g03f,{'r.n':'42','r.d':'63'}).errorCode==='notFull');
  const u01={type:'U01',level:1,terms:[{n:2,d:3,blank:null},{n:8,d:12,blank:'n'}]};
  t('2/3 = □/12 → 8',validateTask(u01,{g1:'8'}).correct&&!validateTask(u01,{g1:'9'}).correct);
  t('7/1000 → 0,007',fractionToDecimalString(7,1000)==='0,007');
  t('125/100 → 1,25',fractionToDecimalString(125,100)==='1,25');
  const d02=(s,den)=>{const p=parseGermanDecimal(s);return {type:'D02',level:1,n:p.num,den:Math.pow(10,p.places),places:p.places,s};};
  t('0,04 → 4/100',validateTask(d02('0,04'),{'r.n':'4','r.d':'100'}).correct&&!validateTask(d02('0,04'),{'r.n':'4','r.d':'10'}).correct);
  t('0,050 → 50/1000',validateTask(d02('0,050'),{'r.n':'50','r.d':'1000'}).correct&&!validateTask(d02('0,050'),{'r.n':'5','r.d':'100'}).correct);
  t('1,25 → 125/100',validateTask(d02('1,25'),{'r.n':'125','r.d':'100'}).correct);
  t('parse 0.25',parseGermanDecimal('0.25').num===25);
  const d03a={type:'D03',level:1,w:2,n:1,d:3},d03b={type:'D03',level:2,w:6,n:5,d:7};
  t('2 1/3 → 7/3',validateTask(d03a,{'r.n':'7','r.d':'3'}).correct);
  t('6 5/7 → 47/7',validateTask(d03b,{'r.n':'47','r.d':'7'}).correct);
  const d01={type:'D01',level:1,n:7,den:1000};
  t('D01 7/1000 = 0,007',validateTask(d01,{dec:'0,007'}).correct&&!validateTask(d01,{dec:'0,07'}).correct);
  const o01={type:'O01',level:1,p:2,q:3,need:4};
  t('O01: vier verschiedene',validateTask(o01,{rows:4,'x0.n':'4','x0.d':'6','x1.n':'6','x1.d':'9','x2.n':'8','x2.d':'12','x3.n':'10','x3.d':'15'}).correct);
  t('O01: Doppelte abgelehnt',!validateTask(o01,{rows:4,'x0.n':'4','x0.d':'6','x1.n':'4','x1.d':'6','x2.n':'8','x2.d':'12','x3.n':'10','x3.d':'15'}).correct);
  const o02={type:'O02',level:1,a:12,b:18,p:2,q:3,mode:'target'};
  t('O02: Wege ÷6 und ÷2,÷3',validateTask(o02,{paths:[[6],[2,3]]}).correct);
  t('O02: gleiche Wege abgelehnt',!validateTask(o02,{paths:[[2,3],[2,3]]}).correct);
  t('O02: Fraktion nach Weg',pathFraction(12,18,[2,3])[0]===2&&pathFraction(12,18,[2,3])[1]===3);
  const t01={type:'T01',level:1,n:124,k:2};
  t('T01: 124 durch 2',validateTask(t01,{ans:'ja'}).correct&&!validateTask(t01,{ans:'nein'}).correct);
  const g04n={type:'G04',level:1,mode:'full',a:5,b:7,p:5,q:7,irreducible:true};
  t('G04: nicht kürzbar',validateTask(g04n,{none:true}).correct&&validateTask(g04n,{'r.n':'5','r.d':'7'}).correct&&!validateTask({type:'G04',level:1,mode:'full',a:10,b:14,p:5,q:7},{none:true}).correct);
  const g05={type:'G05',level:1,mode:'denom',a:6,b:9,N:3};
  t('G05: 6/9 = □/3 → 2',validateTask(g05,{'r.n':'2'}).correct&&!validateTask(g05,{'r.n':'3'}).correct);
  const g05t={type:'G05',level:1,mode:'twostep',a:4,b:6,k:3,m:2};
  t('G05: 4/6 mit 3 erweitern, mit 2 kürzen',validateTask(g05t,{'r1.n':'12','r1.d':'18','r2.n':'6','r2.d':'9'}).correct);
  t('Rang-Berechnung',rankInfo(0).i===0&&rankInfo(60).i===1&&rankInfo(900).i===5);
  /* Generatoren: viele Läufe, jede Variante muss lösbar und erzeugbar sein */
  let gen=0;
  for(const id of PRACTICE_ORDER)for(const lvl of [1,2])for(let i=0;i<150;i++){
    const task=generateTask(id,lvl);gen++;
    if(!task||task.type!==id)t('Generator '+id,false);
    if(TASKS[id].hints(task).length<2)t('Tipps '+id,false);
    if(!Array.isArray(task.avoid))t('avoid '+id,false);
  }
  t('Generatoren liefen ('+gen+' Aufgaben)',true);
  /* Memory: Werte paarweise verschieden */
  for(const lvl of [1,2]){
    const p=genMemoryPairs(lvl,lvl===1?6:10,RNG),keys=p.map(x=>redKey(x[0].n,x[0].d));
    t('Memory Niveau '+lvl+': '+p.length+' Paare, Werte verschieden',p.length===(lvl===1?6:10)&&new Set(keys).size===keys.length&&p.every(x=>equivalent(x[0].n,x[0].d,x[1].n,x[1].d)));
  }
  const bad=res.filter(r=>!r.ok);
  console.log(`Selbsttest: ${res.length-bad.length}/${res.length} bestanden`);
  bad.forEach(b=>console.error('FEHLER:',b.name));
  return {total:res.length,failed:bad.map(b=>b.name),passed:res.length-bad.length};
}
window.runSelfTests=runSelfTests;

/* ---------- Start ---------- */
(function boot(){
  try{localStorage.setItem(KEY+'_probe','1');localStorage.removeItem(KEY+'_probe');}catch(e){Store.ok=false;}
  if((S.schema||1)<3){S.rounds={};Object.keys(S.games||{}).forEach(k=>{S.games[k].state=null;});S.schema=3;persist();}
  if(!S.view||(S.view.kind==='home'&&S.view.tab==='aufgaben'))S.view={kind:'home',tab:'ueben',group:S.view&&S.view.group};
  try{history.replaceState({v:S.view},'');}catch(e){}
  renderAll();
})();
</script>
